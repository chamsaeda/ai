<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>서포트 벡터 머신(SVM) - 경계선을 가장 넓게 그려요</title>
  <style>
    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    canvas { image-rendering: auto; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .slide-in { animation: slideIn 0.4s ease-out; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-5px); }
      40%,80% { transform: translateX(5px); }
    }
    .shake { animation: shake 0.4s ease; }
    @keyframes popIn {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: popIn 0.35s ease-out; }
    @keyframes nodePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    .node-pulse { animation: nodePulse 1.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .slide-in, .pop-in, .shake, .node-pulse { animation: none; }
    }
  </style>
