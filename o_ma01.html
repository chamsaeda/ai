  <style>
    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: linear-gradient(135deg, #065f46 0%, #0f766e 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    @keyframes bounceOnce {
      0%, 100% { transform: translateY(0) translateX(-50%); }
      50% { transform: translateY(-10px) translateX(-50%); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .slide-in { animation: slideIn 0.4s ease-out; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-5px); }
      40%,80% { transform: translateX(5px); }
    }
    .shake { animation: shake 0.4s ease; }
    @keyframes popIn {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: popIn 0.35s ease-out; }
    @keyframes pulseGlow {
      0%,100% { filter: drop-shadow(0 0 0px currentColor); }
      50%     { filter: drop-shadow(0 0 8px currentColor); }
    }
    .pulse-glow { animation: pulseGlow 1s ease-in-out infinite; }
  </style>

<body>
<div id="root">
  <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">

    <div class="bg-gradient-to-r from-emerald-700 to-teal-700 p-6 text-white">
      <div class="flex justify-between items-center mb-2">
        <div class="text-base text-emerald-100">고등학교 인공지능 학습자료</div>
        <a href="index.html"
          class="bg-white text-emerald-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-emerald-50 transition-all shadow-md hover:shadow-lg flex items-center gap-2">
          🏠 홈으로
        </a>
      </div>
      <h1 class="text-3xl font-bold mb-2">🧪 기계학습 데이터 전처리 체험</h1>
      <p class="text-emerald-100">데이터를 다듬어서 기계학습이 잘 배울 수 있도록 만들어봐요!</p>
      <div id="goal-box"></div>
    </div>

    <div id="tab-buttons" class="flex gap-2 p-4 bg-gray-50 border-b border-gray-200 overflow-x-auto"></div>

    <div id="tab-content" class="p-6"></div>

    <div class="p-6 text-center border-t border-gray-100">
      <p class="text-gray-400 text-sm mb-4">🌱 데이터를 깨끗하게 다듬어야 기계학습이 똑똑해져요!</p>
      <a href="index.html"
        class="inline-block bg-gradient-to-r from-emerald-700 to-teal-700 text-white w-64 py-3 rounded-lg font-bold text-lg hover:opacity-90 transition-all shadow-lg hover:shadow-xl">
        🏠 홈으로 돌아가기
      </a>
    </div>

  </div>
</div>
<script>
/* ═══════════════════════════════════════════
   공통 헬퍼
═══════════════════════════════════════════ */
function infoBoxHtml(text) {
  return `<div class="bg-yellow-50 p-4 rounded-lg border border-yellow-300">
    <p class="font-bold text-yellow-900 mb-1">💡 학습 방법</p>
    <p class="text-base text-gray-700">${text}</p>
  </div>`;
}

const CONCEPT_THEMES = {
  teal: { bg:'bg-teal-50', border:'border-teal-200', text:'text-teal-900' },
  rose: { bg:'bg-rose-50', border:'border-rose-200', text:'text-rose-900' },
};
function conceptCardHtml(icon, title, theme, bodyHtml) {
  const c = CONCEPT_THEMES[theme];
  return `<div class="${c.bg} border-2 ${c.border} rounded-xl p-5">
    <h3 class="text-lg font-bold ${c.text} mb-2">${icon} ${title}</h3>
    <div class="text-base text-gray-700 leading-relaxed space-y-1">${bodyHtml}</div>
  </div>`;
}

/* ═══════════════════════════════════════════
   전역 상태 & 탭 전환
═══════════════════════════════════════════ */
const TABS = [
  { id:'intro',   label:'🤖 기계학습이란?' },
  { id:'attr',    label:'🏷️ 데이터 속성' },
  { id:'rowcol',  label:'🧾 row/column' },
  { id:'missing', label:'🕳️ 결측치 처리' },
  { id:'outlier', label:'📍 이상치 처리' },
  { id:'bias',    label:'⚖️ 데이터 편향성' },
  { id:'corr',    label:'📈 상관관계' },
  { id:'quiz',    label:'🎯 퀴즈' },
];
let currentTab = 'intro';
let showGoal = false;

function renderTabButtons() {
  const el = document.getElementById('tab-buttons');
  el.innerHTML = TABS.map(t => `
    <button data-tab="${t.id}" class="px-5 py-2 rounded-lg font-bold text-base transition-all whitespace-nowrap ${
      currentTab === t.id
        ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-md'
        : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'}">
      ${t.label}
    </button>`).join('');
  el.querySelectorAll('[data-tab]').forEach(btn => {
    btn.onclick = () => switchTab(btn.dataset.tab);
  });
}

function switchTab(id) {
  if (currentTab === id) return;
  currentTab = id;
  renderTabButtons();
  renderTabContent();
}

function renderTabContent() {
  const el = document.getElementById('tab-content');
  if (currentTab === 'intro')        renderIntroTab(el);
  else if (currentTab === 'attr')    renderAttributeTab(el);
  else if (currentTab === 'rowcol')  renderRowColTab(el);
  else if (currentTab === 'missing') renderMissingTab(el);
  else if (currentTab === 'outlier') renderOutlierTab(el);
  else if (currentTab === 'bias')    renderBiasTab(el);
  else if (currentTab === 'corr')    renderCorrelationTab(el);
  else if (currentTab === 'quiz')    renderQuizTab(el);
}

function renderGoalBox() {
  const el = document.getElementById('goal-box');
  el.innerHTML = `
    <button id="goal-toggle-btn" class="w-full bg-white/10 hover:bg-white/15 rounded-lg p-4 mt-4 transition-colors text-left">
      <div class="flex items-center justify-between">
        <p class="font-bold">🎯 오늘 우리가 할 수 있게 될 것</p>
        <span class="text-xl transition-transform duration-300 ${showGoal ? 'rotate-180' : ''}">⌄</span>
      </div>
      ${showGoal ? `
        <div class="slide-in mt-2 space-y-1">
          <p class="text-emerald-50 text-base">🧠 기계학습이 무엇인지, 전통적 프로그래밍과 어떻게 다른지 설명할 수 있어요.</p>
          <p class="text-emerald-50 text-base">🏷️ 데이터의 속성·유형·역할(feature/target/meta/skip)을 구분할 수 있어요.</p>
          <p class="text-emerald-50 text-base">🕳️📍 결측치와 이상치를 찾아 알맞게 처리하는 방법을 체험할 수 있어요.</p>
          <p class="text-emerald-50 text-base">📈 데이터 편향성과 상관관계의 의미를 이해할 수 있어요.</p>
        </div>` : ''}
    </button>`;
  document.getElementById('goal-toggle-btn').onclick = () => { showGoal = !showGoal; renderGoalBox(); };
}

/* ═══════════════════════════════════════════
   탭 1: 기계학습이란?
═══════════════════════════════════════════ */
const recoFactors = [
  { icon:'📺', label:'시청 기록', desc:'사용자의 시청 습관' },
  { icon:'🧑‍🤝‍🧑', label:'유사한 사용자 데이터', desc:'유사한 사용자의 구매 패턴' },
  { icon:'🛒', label:'과거 구매', desc:'사용자의 이전 구매 내역' },
  { icon:'🔎', label:'검색 기록', desc:'사용자의 검색 쿼리' },
  { icon:'🤖', label:'기계 학습', desc:'데이터 분석을 위한 알고리즘' },
];
let introState = { openFactor: null };

function renderIntroTab(el) {
  el.innerHTML = `
    <div class="slide-in space-y-6">
      ${infoBoxHtml('탭을 순서대로 눌러보며 기계학습이 무엇인지, 데이터를 어떻게 다루는지 직접 체험해봐요!')}

      <div class="bg-gradient-to-r from-emerald-50 to-teal-50 p-6 rounded-xl border border-emerald-200">
        <h2 class="text-xl font-bold text-emerald-900 mb-3">🤔 내 취향을 어떻게 알았지?</h2>
        <p class="text-base text-gray-600 mb-3">카드를 눌러서 개인화된 추천을 만드는 5가지 요소를 확인해보세요.</p>
        <div class="grid sm:grid-cols-3 md:grid-cols-5 gap-3">
          ${recoFactors.map((f, i) => `
            <button data-factor="${i}" class="p-4 rounded-lg text-center border-2 transition-all ${introState.openFactor === i ? 'bg-emerald-600 border-emerald-700 text-white pop-in' : 'bg-white border-emerald-200 hover:border-emerald-400'}">
              <div class="text-3xl mb-1">${f.icon}</div>
              <div class="font-bold text-sm">${f.label}</div>
              ${introState.openFactor === i ? `<div class="text-xs mt-2 slide-in">${f.desc}</div>` : ''}
            </button>`).join('')}
        </div>
        <div class="bg-emerald-100 p-4 rounded-lg border-l-4 border-emerald-500 mt-4">
          <p class="text-base text-gray-700 leading-relaxed">이 다섯 가지가 모여 나에게 꼭 맞는 <span class="font-bold text-emerald-700">「개인화된 추천」</span>이 만들어져요!</p>
        </div>
      </div>

      ${conceptCardHtml('🧠', '기계학습이란?', 'teal', `
        <p>데이터를 학습시켜 <b>스스로 규칙을 발견</b>하고, 이를 새로운 데이터에 적용하여 정보를 얻거나 <b>예측</b>하는 기술이에요.</p>
        <p>사람이 규칙을 하나하나 알려주지 않아도, 컴퓨터가 데이터 속에서 규칙(패턴)을 스스로 찾아내고, 한 번도 본 적 없는 새로운 데이터에 적용해 결과를 예측해요.</p>
      `)}

      <div class="grid md:grid-cols-2 gap-5">
        <div class="bg-white border-2 border-gray-200 rounded-xl p-5">
          <h3 class="text-lg font-bold text-gray-800 mb-2">🧑‍💻 전통적 프로그래밍</h3>
          <p class="text-base text-gray-600 mb-2 font-bold">Q. 평균 기온이 가장 높은 해는?</p>
          <p class="text-base text-gray-600">평균 기온 데이터를 모두 비교해 가장 큰 값을 찾은 후, 해당 연도를 출력해요.</p>
          <p class="text-sm text-gray-400 mt-2">→ 사람이 규칙을 직접 작성</p>
        </div>
        <div class="bg-emerald-50 border-2 border-emerald-300 rounded-xl p-5">
          <h3 class="text-lg font-bold text-emerald-800 mb-2">🤖 기계학습 적용</h3>
          <p class="text-base text-gray-600 mb-2 font-bold">Q. 2050년의 평균 기온은?</p>
          <p class="text-base text-gray-600">주어진 데이터에 답이 없으니, 기계가 스스로 학습해 규칙을 발견한 후 해답을 찾아요.</p>
          <p class="text-sm text-emerald-500 mt-2">→ 기계가 규칙을 스스로 발견</p>
        </div>
      </div>

      <div class="bg-white border-2 border-gray-200 rounded-xl p-5">
        <h3 class="text-lg font-bold text-gray-800 mb-3">📜 인공지능 · 기계학습 · 딥러닝의 관계</h3>
        <div class="grid sm:grid-cols-3 gap-4">
          <div class="bg-sky-50 rounded-lg p-4 border border-sky-200">
            <p class="text-sm text-sky-500 font-bold">1950's</p>
            <p class="text-lg font-bold text-sky-800">인공지능 (AI)</p>
            <p class="text-sm text-gray-600 mt-1">인간이 가진 지적 능력을 컴퓨터로 구현하는 기술</p>
          </div>
          <div class="bg-teal-50 rounded-lg p-4 border border-teal-200">
            <p class="text-sm text-teal-500 font-bold">1980's</p>
            <p class="text-lg font-bold text-teal-800">기계학습 (ML)</p>
            <p class="text-sm text-gray-600 mt-1">스스로 학습하여 인공지능의 성능을 향상시키는 기술</p>
          </div>
          <div class="bg-indigo-50 rounded-lg p-4 border border-indigo-200">
            <p class="text-sm text-indigo-500 font-bold">2010's</p>
            <p class="text-lg font-bold text-indigo-800">딥러닝 (DL)</p>
            <p class="text-sm text-gray-600 mt-1">인간의 뉴런과 비슷한 인공 신경망으로 정보를 처리</p>
          </div>
        </div>
      </div>
    </div>`;

  el.querySelectorAll('[data-factor]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.factor, 10);
      introState.openFactor = (introState.openFactor === i) ? null : i;
      renderIntroTab(el);
    };
  });
}

/* ═══════════════════════════════════════════
   탭 2: 데이터 속성 & 유형
═══════════════════════════════════════════ */
const typeItems = [
  { id:1, text:'키 170cm', type:'numeric' },
  { id:2, text:'좋아하는 계절 (봄/여름/가을/겨울)', type:'categorical' },
  { id:3, text:'자기소개 문장', type:'text' },
  { id:4, text:'생일 (2010-05-03)', type:'datetime' },
  { id:5, text:'국어 점수 92점', type:'numeric' },

/* ═══════════════════════════════════════════
   탭 4: 결측치 처리
═══════════════════════════════════════════ */
const missingRaw = [
  { 이름:'가람', 자습시간:9, 점수:99, 이수여부:'이수', 키:168, 발사이즈:229, 구분:'3학년' },
  { 이름:'나래', 자습시간:9, 점수:98, 이수여부:'이수', 키:167, 발사이즈:249, 구분:'2학년' },
  { 이름:'다솜', 자습시간:8, 점수:88, 이수여부:'이수', 키:158, 발사이즈:233, 구분:'2학년' },
  { 이름:'라온', 자습시간:8, 점수:90, 이수여부:'이수', 키:157, 발사이즈:226, 구분:'2학년' },
  { 이름:'아람', 자습시간:4, 점수:null, 이수여부:null, 키:155, 발사이즈:218, 구분:'2학년' },
  { 이름:'아라', 자습시간:2, 점수:20, 이수여부:'미이수', 키:163, 발사이즈:250, 구분:'1학년' },
  { 이름:'찬솔', 자습시간:0, 점수:10, 이수여부:'미이수', 키:null, 발사이즈:255, 구분:'1학년' },
  { 이름:'한울', 자습시간:2, 점수:null, 이수여부:null, 키:158, 발사이즈:228, 구분:null },
];
const missingCols = ['이름','자습시간','점수','이수여부','키','발사이즈','구분'];
const numericCols = ['자습시간','점수','키','발사이즈'];
const categoricalCols = ['이수여부','구분'];

function meanOf(arr) {
  const n = arr.filter(v => v !== null && v !== undefined);
  return n.length ? Math.round((n.reduce((a, b) => a + b, 0) / n.length) * 10) / 10 : 0;
}
function modeOf(arr) {
  const counts = {};
  arr.filter(v => v !== null && v !== undefined).forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  let best = null, bestC = -1;
  Object.entries(counts).forEach(([k, c]) => { if (c > bestC) { best = k; bestC = c; } });
  return best;
}

let missingState = { found: new Set(), method: null };

function renderMissingTab(el) {
  let totalMissing = 0;
  missingRaw.forEach(row => missingCols.forEach(c => { if (row[c] === null) totalMissing++; }));

  let processed = null;
  if (missingState.method === 'delete') {
    processed = missingRaw.filter(row => missingCols.every(c => row[c] !== null));
  } else if (missingState.method === 'meanmode') {
    const means = {}; numericCols.forEach(c => means[c] = meanOf(missingRaw.map(r => r[c])));
    const modes = {}; categoricalCols.forEach(c => modes[c] = modeOf(missingRaw.map(r => r[c])));
    processed = missingRaw.map(row => {
      const newRow = { ...row };
      missingCols.forEach(c => {
        if (newRow[c] === null) {
          if (numericCols.includes(c)) newRow[c] = means[c];
          else if (categoricalCols.includes(c)) newRow[c] = modes[c];
        }
      });
      return newRow;
    });
  } else if (missingState.method === 'zero') {
    processed = missingRaw.map(row => {
      const newRow = { ...row };
      missingCols.forEach(c => { if (newRow[c] === null) newRow[c] = numericCols.includes(c) ? 0 : '미확인'; });
      return newRow;
    });
  }

  const allFound = missingState.found.size >= totalMissing;

  el.innerHTML = `
    <div class="slide-in space-y-6">
      ${infoBoxHtml('표에서 빈칸(❓)을 모두 찾아 클릭해보세요! 다 찾으면 결측치 처리 방법을 선택할 수 있어요.')}

      <div class="bg-white border-2 border-gray-200 rounded-xl p-5 overflow-x-auto">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-lg font-bold text-gray-800">🕳️ 결측치 찾기</h3>
          <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-bold text-sm">${missingState.found.size} / ${totalMissing} 개 발견</span>
        </div>
        <table class="min-w-full text-center text-sm border-collapse">
          <thead><tr>${missingCols.map(c => `<th class="p-2 border border-gray-200 bg-emerald-50 font-bold">${c}</th>`).join('')}</tr></thead>
          <tbody>
            ${missingRaw.map((row, i) => `
              <tr>
                ${missingCols.map(c => {
                  const isNull = row[c] === null;
                  const key = i + '-' + c;
                  const isFound = missingState.found.has(key);
                  return `<td data-row="${i}" data-col="${c}" class="p-2 border border-gray-200 cursor-pointer select-none transition-colors ${isNull ? (isFound ? 'bg-red-100 text-red-500 font-bold' : 'bg-gray-50 hover:bg-yellow-50') : ''}">${isNull ? (isFound ? '❓' : '?') : row[c]}</td>`;
                }).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
        ${allFound ? `<p class="text-emerald-600 font-bold mt-3 slide-in">🎉 모든 결측치를 찾았어요! 아래에서 처리 방법을 골라보세요.</p>` : ''}
      </div>

      ${allFound ? `
        <div class="slide-in bg-gradient-to-r from-emerald-50 to-teal-50 p-5 rounded-xl border border-emerald-200">
          <h3 class="text-lg font-bold text-emerald-900 mb-3">🛠️ 결측치 처리 방법 선택</h3>
          <div class="flex flex-wrap gap-3 mb-4">
            <button data-method="delete" class="px-4 py-2 rounded-lg font-bold text-sm border-2 ${missingState.method === 'delete' ? 'bg-emerald-600 text-white border-emerald-700' : 'bg-white border-gray-200 hover:border-emerald-300'}">🗑️ 결측치 있는 행 삭제</button>
            <button data-method="meanmode" class="px-4 py-2 rounded-lg font-bold text-sm border-2 ${missingState.method === 'meanmode' ? 'bg-emerald-600 text-white border-emerald-700' : 'bg-white border-gray-200 hover:border-emerald-300'}">📊 평균값 / 최빈값으로 채우기</button>
            <button data-method="zero" class="px-4 py-2 rounded-lg font-bold text-sm border-2 ${missingState.method === 'zero' ? 'bg-emerald-600 text-white border-emerald-700' : 'bg-white border-gray-200 hover:border-emerald-300'}">0️⃣ 특정값(0 / 미확인)으로 채우기</button>
          </div>
          ${processed ? `
            <div class="overflow-x-auto slide-in">
              <table class="min-w-full text-center text-sm border-collapse bg-white rounded-lg overflow-hidden">
                <thead><tr>${missingCols.map(c => `<th class="p-2 border border-gray-200 bg-teal-50 font-bold">${c}</th>`).join('')}</tr></thead>
                <tbody>
                  ${processed.map((row, i) => `
                    <tr>
                      ${missingCols.map(c => {
                        const wasNull = missingRaw[i] ? missingRaw[i][c] === null : false;
                        return `<td class="p-2 border border-gray-200 ${wasNull ? 'bg-yellow-100 font-bold text-emerald-700' : ''}">${row[c]}</td>`;
                      }).join('')}
                    </tr>`).join('')}
                </tbody>
              </table>
              <p class="text-sm text-gray-500 mt-2">노란색 칸이 새로 채워지거나 처리된 부분이에요. ${missingState.method === 'delete' ? `(전체 ${missingRaw.length}행 → ${processed.length}행으로 줄었어요)` : ''}</p>
            </div>` : ''}
        </div>` : ''}
    </div>`;

  el.querySelectorAll('td[data-row][data-col]').forEach(td => {
    td.onclick = () => {
      const i = Number(td.dataset.row), c = td.dataset.col;
      if (missingRaw[i][c] === null) {
        missingState.found.add(i + '-' + c);
        renderMissingTab(el);
      }
    };
  });
  el.querySelectorAll('[data-method]').forEach(btn => {
    btn.onclick = () => { missingState.method = btn.dataset.method; renderMissingTab(el); };
  });
}

let outlierState = {};
outlierConfigs.forEach(cfg => { outlierState[cfg.key] = { found:false, wrongIdx:null, removed:false }; });

function scatterOutlierHtml(cfg) {
  const st = outlierState[cfg.key];
  const W = 460, H = 300, M = 40;
  const sx = v => M + ((v - cfg.xDomain[0]) / (cfg.xDomain[1] - cfg.xDomain[0])) * (W - 2 * M);
  const sy = v => H - M - ((v - cfg.yDomain[0]) / (cfg.yDomain[1] - cfg.yDomain[0])) * (H - 2 * M);
  const displayPoints = st.removed ? cfg.points.filter((_, i) => i !== cfg.outlierIdx) : cfg.points;

  const circles = displayPoints.map(p => {
    const realIdx = cfg.points.indexOf(p);
    const isOutlier = realIdx === cfg.outlierIdx;
    const wrong = st.wrongIdx === realIdx;
    const isFoundOutlier = st.found && isOutlier;
    const fill = isFoundOutlier ? '#ef4444' : (wrong ? '#f97316' : '#10b981');
    const r = isFoundOutlier ? 9 : 6;
    return `<circle data-key="${cfg.key}" data-idx="${realIdx}" cx="${sx(p.x)}" cy="${sy(p.y)}" r="${r}" fill="${fill}" fill-opacity="${isFoundOutlier ? 1 : 0.75}" stroke="${isFoundOutlier ? '#b91c1c' : 'none'}" stroke-width="2" class="cursor-pointer ${isFoundOutlier ? 'pulse-glow' : ''} ${wrong ? 'shake' : ''}"></circle>`;
  }).join('');

  return `
    <div class="bg-white border-2 border-gray-200 rounded-xl p-5">
      <h3 class="text-lg font-bold text-gray-800 mb-2">${cfg.title}</h3>
      <p class="text-sm text-gray-500 mb-2">점을 클릭해서 「이상치」를 찾아보세요! (자습을 많이 했는데 점수가 이상하거나, 키에 비해 발 크기가 이상한 값)</p>
      <svg viewBox="0 0 ${W} ${H}" class="w-full max-w-md bg-gray-50 rounded-lg border border-gray-100">
        <line x1="${M}" y1="${H - M}" x2="${W - M}" y2="${H - M}" stroke="#94a3b8" stroke-width="1"></line>
        <line x1="${M}" y1="${M}" x2="${M}" y2="${H - M}" stroke="#94a3b8" stroke-width="1"></line>
        <text x="${W / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#64748b">${cfg.xLabel}</text>
        <text x="12" y="${H / 2}" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 12 ${H / 2})">${cfg.yLabel}</text>
        ${circles}
      </svg>
      ${st.found ? `
        <div class="slide-in mt-3 space-y-2">
          <p class="text-red-600 font-bold text-sm">🎯 찾았어요! ${cfg.insight}</p>
          <button data-remove="${cfg.key}" class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-4 py-2 rounded-lg font-bold text-sm hover:opacity-90">${st.removed ? '이상치 다시 보기' : '이상치 제거하고 보기 →'}</button>
        </div>` : ''}
    </div>`;
}

function renderOutlierTab(el) {
  el.innerHTML = `
    <div class="slide-in space-y-6">
      ${infoBoxHtml('산점도(Scatter Plot)로 데이터를 그려보면, 다른 점들과 멀리 떨어진 값을 쉽게 발견할 수 있어요. 이상한 점을 직접 클릭해서 찾아보세요!')}
      <div class="grid md:grid-cols-2 gap-5">
        ${scatterOutlierHtml(outlierConfigs[0])}
        ${scatterOutlierHtml(outlierConfigs[1])}
      </div>
      <div class="bg-rose-50 border border-rose-200 rounded-xl p-4 text-base text-gray-700">
        <p class="font-bold text-rose-800 mb-1">⚠️ 이상치 처리</p>
        <p>이상치가 있는 행(row)만 제외하고 나머지 행들을 선택하는 방법을 주로 사용해요. (Orange3의 Select Rows 위젯과 같은 역할)</p>
      </div>
    </div>`;

  el.querySelectorAll('circle[data-key]').forEach(c => {
    c.onclick = () => {
      const key = c.dataset.key;
      const idx = Number(c.dataset.idx);
      const cfg = outlierConfigs.find(cc => cc.key === key);
      const st = outlierState[key];
      if (st.found) return;
      if (idx === cfg.outlierIdx) {
        st.found = true;
        renderOutlierTab(el);
      } else {
        st.wrongIdx = idx;
        renderOutlierTab(el);
        setTimeout(() => { st.wrongIdx = null; renderOutlierTab(el); }, 400);
      }
    };
  });
  el.querySelectorAll('[data-remove]').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.remove;
      outlierState[key].removed = !outlierState[key].removed;
      renderOutlierTab(el);
    };
  });
}

/* ═══════════════════════════════════════════
   탭 7: 상관관계
═══════════════════════════════════════════ */
const CORR_N = 36;
function seeded(seed) { let s = seed; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
const rnd = seeded(7);
const baseX = Array.from({ length: CORR_N }, () => rnd() * 2 - 1);
const baseNoise = Array.from({ length: CORR_N }, () => rnd() * 2 - 1);

const corrScenarios = [
  { id:1, text:'자습시간이 길어질수록 시험 점수가 높아진다', ans:'pos' },
  { id:2, text:'냉방기 사용 시간이 길어질수록 전기 요금이 많이 나온다', ans:'pos' },
  { id:3, text:'운동 시간이 늘어날수록 체지방률이 낮아진다', ans:'neg' },
];
let corrState = { r: 0.8, answers: {}, showSparrow: false };

function corrInterpret(r) {
  const a = Math.abs(r);
  const dir = r > 0.05 ? '양의' : (r < -0.05 ? '음의' : '');
  if (a >= 0.7) return `강한 ${dir} 상관관계예요`;
  if (a >= 0.3) return `보통 정도의 ${dir} 상관관계예요`;
  if (a > 0.05) return `약한 ${dir} 상관관계예요`;
  return '거의 상관관계가 없어요';
}

const CORR_W = 460, CORR_H = 280, CORR_M = 30;
function corrSx(v) { return CORR_M + ((v + 1.6) / 3.2) * (CORR_W - 2 * CORR_M); }
function corrSy(v) { return CORR_H - CORR_M - ((v + 1.6) / 3.2) * (CORR_H - 2 * CORR_M); }

function corrPointsHtml(r) {
  return baseX.map((x, i) => {
    const noise = baseNoise[i];
    const y = r * x + Math.sqrt(Math.max(0, 1 - r * r)) * noise;
    return `<circle cx="${corrSx(x)}" cy="${corrSy(y)}" r="5" fill="#0d9488" fill-opacity="0.7"></circle>`;
  }).join('');
}

function updateCorrDynamic(el, r) {
  const rlabel = el.querySelector('#corr-rlabel');
  if (rlabel) rlabel.textContent = `r = ${r.toFixed(1)}`;
  const interp = el.querySelector('#corr-interp');
  if (interp) interp.textContent = corrInterpret(r);
  const points = el.querySelector('#corr-points');
  if (points) points.innerHTML = corrPointsHtml(r);
}

function renderCorrelationTab(el) {
  const r = corrState.r;

  el.innerHTML = `
    <div class="slide-in space-y-6">
      ${infoBoxHtml('슬라이더를 움직여 상관계수(r)를 바꿔보고, 산점도의 모양이 어떻게 달라지는지 관찰해보세요!')}

      <div class="bg-white border-2 border-gray-200 rounded-xl p-5">
        <h3 class="text-lg font-bold text-gray-800 mb-3">📈 상관계수(r) 실험실</h3>
        <div class="flex items-center gap-4 mb-4 flex-wrap">
          <input id="corr-slider" type="range" min="-1" max="1" step="0.1" value="${r}" class="w-full max-w-xs accent-emerald-600" />
          <span id="corr-rlabel" class="font-bold text-emerald-700 text-lg">r = ${r.toFixed(1)}</span>
          <span id="corr-interp" class="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-sm font-bold">${corrInterpret(r)}</span>
        </div>
        <svg viewBox="0 0 ${CORR_W} ${CORR_H}" class="w-full max-w-md bg-gray-50 rounded-lg border border-gray-100">
          <line x1="${CORR_M}" y1="${CORR_H / 2}" x2="${CORR_W - CORR_M}" y2="${CORR_H / 2}" stroke="#e2e8f0" stroke-width="1"></line>
          <line x1="${CORR_W / 2}" y1="${CORR_M}" x2="${CORR_W / 2}" y2="${CORR_H - CORR_M}" stroke="#e2e8f0" stroke-width="1"></line>
          <g id="corr-points">${corrPointsHtml(r)}</g>
        </svg>
        <div class="grid grid-cols-3 gap-2 mt-3 text-center text-sm">
          <div class="bg-red-50 rounded-lg p-2"><p class="font-bold text-red-600">-1</p><p class="text-gray-500 text-xs">완전한 음의 상관</p></div>
          <div class="bg-gray-50 rounded-lg p-2"><p class="font-bold text-gray-500">0</p><p class="text-gray-500 text-xs">상관 없음</p></div>
          <div class="bg-green-50 rounded-lg p-2"><p class="font-bold text-green-600">+1</p><p class="text-gray-500 text-xs">완전한 양의 상관</p></div>
        </div>
      </div>

      <div class="bg-gradient-to-r from-teal-50 to-emerald-50 p-5 rounded-xl border border-teal-200">
        <h3 class="text-lg font-bold text-teal-900 mb-3 flex items-center gap-2">
          <span id="sparrow-icon" class="relative inline-block cursor-pointer">
            🧩
            ${corrState.showSparrow ? `
              <span class="absolute left-1/2 -translate-x-1/2 -top-10 bg-yellow-400 text-gray-900 px-3 py-1 rounded-xl text-sm font-bold whitespace-nowrap shadow-2xl z-50" style="animation: bounceOnce 0.4s ease-in-out;">${"\uCC38\uC0C8"}</span>
            ` : ''}
          </span>
          양의 상관일까 음의 상관일까?
        </h3>
        <div class="space-y-3">
          ${corrScenarios.map(s => {
            const answered = corrState.answers[s.id] !== undefined;
            const correct = answered && corrState.answers[s.id] === s.ans;
            return `
              <div class="bg-white rounded-lg p-4 shadow-sm ${answered && !correct ? 'shake' : ''}">
                <p class="text-base text-gray-700 mb-3">${s.text}</p>
                <div class="flex gap-2">
                  <button data-corr="${s.id}" data-val="pos" ${answered ? 'disabled' : ''} class="px-4 py-1.5 rounded-lg border-2 text-sm font-bold ${answered ? (s.ans === 'pos' ? 'bg-green-50 border-green-400 text-green-700' : (corrState.answers[s.id] === 'pos' ? 'bg-red-50 border-red-400 text-red-600' : 'bg-gray-50 border-gray-200 text-gray-300')) : 'bg-gray-50 border-gray-200 hover:bg-teal-50'}">양의 상관</button>
                  <button data-corr="${s.id}" data-val="neg" ${answered ? 'disabled' : ''} class="px-4 py-1.5 rounded-lg border-2 text-sm font-bold ${answered ? (s.ans === 'neg' ? 'bg-green-50 border-green-400 text-green-700' : (corrState.answers[s.id] === 'neg' ? 'bg-red-50 border-red-400 text-red-600' : 'bg-gray-50 border-gray-200 text-gray-300')) : 'bg-gray-50 border-gray-200 hover:bg-teal-50'}">음의 상관</button>
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;

  const slider = el.querySelector('#corr-slider');
  if (slider) slider.oninput = (e) => {
    corrState.r = parseFloat(e.target.value);
    updateCorrDynamic(el, corrState.r);
  };

  const sparrow = el.querySelector('#sparrow-icon');
  if (sparrow) sparrow.onclick = () => {
    corrState.showSparrow = true;
    renderCorrelationTab(el);
    setTimeout(() => { corrState.showSparrow = false; renderCorrelationTab(el); }, 500);
  };

  el.querySelectorAll('[data-corr]').forEach(btn => {
    btn.onclick = () => {
      const id = Number(btn.dataset.corr);
      const val = btn.dataset.val;
      if (corrState.answers[id] !== undefined) return;
      corrState.answers[id] = val;
      renderCorrelationTab(el);
    };
  });
}

  { id:4, q:'결측치가 적고 데이터 양이 충분히 많을 때 가장 간단하고 확실한 처리 방법은?',
    opts:['평균값으로 채운다','결측치가 있는 행을 삭제한다','무조건 0으로 채운다','무시하고 그대로 사용한다'],
    ans:1, expl:'데이터 양이 충분하고 결측치가 있는 행이 소수일 때는 행 전체를 삭제하는 것이 가장 확실한 방법이에요.' },
  { id:5, q:'피어슨 상관계수가 -1에 가까울수록 두 데이터의 관계는?',
    opts:['한쪽이 커지면 다른 쪽도 커진다','아무 관계가 없다','한쪽이 커지면 다른 쪽은 작아진다','항상 같은 값을 가진다'],
    ans:2, expl:'-1에 가까울수록 완전한 음의 상관관계로, 한쪽이 커지면 다른 쪽은 철저히 작아져요.' },
];
let quizState = { answers: {}, shakeId: null };

function calcQuizScore() {
  return quizData.filter(q => quizState.answers[q.id] === q.ans).length;
}

function renderQuizTab(el) {
  const answeredCount = Object.keys(quizState.answers).length;

  el.innerHTML = `
    <div class="slide-in space-y-5">
      <div class="bg-gradient-to-r from-emerald-50 to-teal-50 p-4 rounded-lg border border-emerald-200 flex items-center justify-between flex-wrap gap-2">
        <div>
          <p class="font-bold text-emerald-900">🎯 오늘 배운 내용을 확인해봐요!</p>
          <p class="text-base text-gray-600">보기를 클릭하면 바로 정답을 알 수 있어요.</p>
        </div>
        ${answeredCount > 0 ? `<button id="quiz-retry-btn" class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-4 py-2 rounded-lg font-bold text-base">🔄 다시 풀기</button>` : ''}
      </div>

      <div class="flex gap-2">
        ${quizData.map(q => {
          let cls = 'bg-gray-200';
          if (quizState.answers[q.id] !== undefined) cls = quizState.answers[q.id] === q.ans ? 'bg-green-500' : 'bg-red-400';
          return `<div class="h-2 flex-1 rounded-full transition-all duration-500 ${cls}"></div>`;
        }).join('')}
      </div>

      ${quizData.map(q => {
        const answered = quizState.answers[q.id] !== undefined;
        return `
          <div class="bg-white border-2 border-gray-200 rounded-xl p-5 shadow-sm ${quizState.shakeId === q.id ? 'shake' : ''}">
            <p class="text-base font-bold text-emerald-600 mb-2">Q${q.id} / ${quizData.length}</p>
            <p class="text-base font-bold text-gray-800 mb-4">${q.q}</p>
            <div class="space-y-2 mb-3">
              ${q.opts.map((opt, idx) => {
                let style = 'bg-gray-50 border-gray-200 text-gray-700 hover:bg-emerald-50 hover:border-emerald-300';
                if (answered) {
                  if (idx === q.ans) style = 'bg-green-50 border-green-400 text-green-800 font-bold';
                  else if (idx === quizState.answers[q.id]) style = 'bg-red-50 border-red-400 text-red-700';
                  else style = 'bg-gray-50 border-gray-200 text-gray-400';
                }
                const marks = answered ? (idx === q.ans ? '<span class="ml-2">✅</span>' : (idx === quizState.answers[q.id] ? '<span class="ml-2">❌</span>' : '')) : '';
                return `<button data-quiz="${q.id}" data-idx="${idx}" ${answered ? 'disabled' : ''} class="w-full text-left px-4 py-3 rounded-lg border-2 text-base transition-all ${style} ${answered ? 'cursor-default' : 'cursor-pointer'}"><span class="font-bold mr-2">${['①','②','③','④'][idx]}</span>${opt}${marks}</button>`;
              }).join('')}
            </div>
            ${answered ? `
              <div class="p-3 rounded-lg text-base leading-relaxed ${quizState.answers[q.id] === q.ans ? 'bg-green-50 border border-green-300 text-green-800' : 'bg-orange-50 border border-orange-300 text-orange-800'}">
                ${quizState.answers[q.id] === q.ans ? '🎉 정답이에요! ' : '💡 정답 설명: '}${q.expl}
              </div>` : ''}
          </div>`;
      }).join('')}

      ${answeredCount === quizData.length ? (() => {
        const score = calcQuizScore();
        const emoji = score === quizData.length ? '🏆' : score >= 4 ? '🌟' : score >= 2 ? '👍' : '📚';
        const msg = score === quizData.length ? '완벽해요! 데이터 전처리 마스터예요! 🏆'
          : score >= 4 ? '잘했어요! 거의 다 맞혔네요 👍'
          : score >= 2 ? '조금만 더 복습해봐요! 💪'
          : '다시 한번 처음부터 배워봐요! 📖';
        return `
          <div class="slide-in bg-gradient-to-r from-emerald-50 to-teal-50 p-6 rounded-xl border-2 border-emerald-300 text-center">
            <div class="text-5xl mb-3">${emoji}</div>
            <p class="text-2xl font-bold text-emerald-800 mb-2">${score} / ${quizData.length} 점</p>
            <p class="text-base text-gray-600">${msg}</p>
          </div>`;
      })() : ''}
    </div>`;

  el.querySelectorAll('[data-quiz]').forEach(btn => {
    btn.onclick = () => {
      const qid = Number(btn.dataset.quiz);
      const idx = Number(btn.dataset.idx);
      if (quizState.answers[qid] !== undefined) return;
      quizState.answers[qid] = idx;
      const q = quizData.find(qq => qq.id === qid);
      if (idx !== q.ans) {
        quizState.shakeId = qid;
        renderQuizTab(el);
        setTimeout(() => { quizState.shakeId = null; renderQuizTab(el); }, 400);
      } else {
        renderQuizTab(el);
      }
    };
  });
  const retryBtn = el.querySelector('#quiz-retry-btn');
  if (retryBtn) retryBtn.onclick = () => { quizState.answers = {}; quizState.shakeId = null; renderQuizTab(el); };
}

/* ═══════════════════════════════════════════
   초기 실행
═══════════════════════════════════════════ */
renderGoalBox();
renderTabButtons();
renderTabContent();

</script>
</body>
</html>
