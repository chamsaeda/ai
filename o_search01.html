<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <title>탐색 알고리즘 - 맹목적 탐색과 정보 이용 탐색</title>
  <style>
    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    @keyframes bounceOnce {
      0%, 100% { transform: translateY(0) translateX(-50%); }
      50% { transform: translateY(-10px) translateX(-50%); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .slide-in { animation: slideIn 0.4s ease-out; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-5px); }
      40%,80% { transform: translateX(5px); }
    }
    .shake { animation: shake 0.4s ease; }
    @keyframes pulseGlow {
      0%,100% { filter: drop-shadow(0 0 0px currentColor); }
      50%     { filter: drop-shadow(0 0 8px currentColor); }
    }
    .pulse-glow { animation: pulseGlow 1s ease-in-out infinite; }
    @keyframes nodePulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.08); } }
    .node-pulse-anim { animation: nodePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; transform-origin: center; }
    @keyframes popIn {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: popIn 0.35s ease-out; }
  </style>

const buildAdj = (nodeIds, edges) => {
  const adj = {};
  nodeIds.forEach(id => { adj[id] = []; });
  edges.forEach(([a, b]) => {
    if (!adj[a]) adj[a] = [];
    if (!adj[b]) adj[b] = [];
    adj[a].push(b);
    adj[b].push(a);
  });
  return adj;
};

const computeDfsSteps = (adj, start) => {
  if (!start || !adj[start]) return [];
  const visited = new Set();
  const path = [];
  const steps = [];
  const visit = (node) => {
    visited.add(node);
    path.push(node);
    steps.push({ node, aux: [...path] });
    (adj[node] || []).forEach(nb => { if (!visited.has(nb)) visit(nb); });
    path.pop();
  };
  visit(start);
  return steps;
};

const computeBfsSteps = (adj, start) => {
  if (!start || !adj[start]) return [];
  const visited = new Set([start]);
  const queue = [start];
  const steps = [];
  while (queue.length) {
    const node = queue.shift();
    (adj[node] || []).forEach(nb => {
      if (!visited.has(nb)) { visited.add(nb); queue.push(nb); }
    });
    steps.push({ node, aux: [...queue] });
  }
  return steps;
};

const layoutTree = (nodeIds, edges, root) => {
  const adj = buildAdj(nodeIds, edges);
  const level = { [root]: 0 };
  const order = [root];
  const visited = new Set([root]);
  const queue = [root];
  while (queue.length) {
    const n = queue.shift();
    (adj[n] || []).forEach(nb => {
      if (!visited.has(nb)) { visited.add(nb); level[nb] = level[n] + 1; order.push(nb); queue.push(nb); }
    });
  }
  const byLevel = {};
  order.forEach(n => { (byLevel[level[n]] = byLevel[level[n]] || []).push(n); });
  const positions = {};
  const width = 760, topMargin = 45, rowGap = 95;
  Object.keys(byLevel).forEach(lvl => {
    const arr = byLevel[lvl];
    arr.forEach((n, i) => {
      positions[n] = { x: (width * (i + 1)) / (arr.length + 1) + 20, y: topMargin + Number(lvl) * rowGap };
    });
  });
  return positions;
};

const generateRandomTree = (count) => {
  const labels = [];
  for (let i = 0; i < count; i++) labels.push(i < 26 ? String.fromCharCode(65 + i) : 'N' + i);
  const edges = [];
  for (let i = 1; i < labels.length; i++) {
    const parentIdx = Math.floor(Math.random() * i);
    edges.push([labels[parentIdx], labels[i]]);
  }
  const positions = layoutTree(labels, edges, labels[0]);
  return { nodeIds: labels, edges, positions, root: labels[0] };
};

const arrangeTreeLayout = (nodeIds, edges, root, currentPositions) => {
  if (!root) return currentPositions;
  const rawAdj = buildAdj(nodeIds, edges);
  const adj = {};
  nodeIds.forEach(id => {
    const list = (rawAdj[id] || []).slice();
    list.sort((a, b) => ((currentPositions[a] && currentPositions[a].x) || 0) - ((currentPositions[b] && currentPositions[b].x) || 0));
    adj[id] = list;
  });
  const visited = new Set([root]);
  const xPos = {}, yLevel = {};
  let leafCounter = 0;
  const build = (node, depth) => {
    yLevel[node] = depth;
    const kids = (adj[node] || []).filter(nb => !visited.has(nb));
    kids.forEach(k => visited.add(k));
    if (kids.length === 0) {
      xPos[node] = leafCounter; leafCounter += 1;
    } else {
      kids.forEach(k => build(k, depth + 1));
      const xs = kids.map(k => xPos[k]);
      xPos[node] = xs.reduce((a, b) => a + b, 0) / xs.length;
    }
  };
  build(root, 0);

  const width = 760, topMargin = 45, rowGap = 95;
  const unit = leafCounter > 0 ? width / (leafCounter + 1) : width / 2;
  const positions = {};
  Object.keys(xPos).forEach(n => { positions[n] = { x: 20 + (xPos[n] + 1) * unit, y: topMargin + yLevel[n] * rowGap }; });

  const maxLevel = Object.keys(yLevel).length ? Math.max(...Object.values(yLevel)) : 0;
  const unreached = nodeIds.filter(n => !(n in positions));
  unreached.forEach((n, i) => { positions[n] = { x: 40 + i * 70, y: topMargin + (maxLevel + 1) * rowGap + 30 }; });

  return positions;
};

const PUZZLE_INITIAL = [2,0,3, 1,8,4, 7,6,5];
const PUZZLE_GOAL = [1,2,3, 8,0,4, 7,6,5];
const PUZZLE_DIRS = [
  { key:'좌', label:'좌(왼쪽)', dr:0, dc:-1 },
  { key:'우', label:'우(오른쪽)', dr:0, dc:1 },
  { key:'상', label:'상(위쪽)', dr:-1, dc:0 },
  { key:'하', label:'하(아래쪽)', dr:1, dc:0 },
];
const puzzleRC = (i) => [Math.floor(i / 3), i % 3];
const puzzleApplyMove = (state, dir) => {
  const blankIdx = state.indexOf(0);
  const [r, c] = puzzleRC(blankIdx);
  const nr = r + dir.dr, nc = c + dir.dc;
  if (nr < 0 || nr > 2 || nc < 0 || nc > 2) return null;
  const next = state.slice();
  const ni = nr * 3 + nc;
  next[blankIdx] = state[ni];
  next[ni] = 0;
  return next;
};
const PUZZLE_MAX_DEPTH = 3;
const buildPuzzleTree = () => {
  const nodesOut = []; const edgesOut = [];
  let leafCounter = 0;
  const walk = (state, depth, id, parentState) => {
    const tries = depth < PUZZLE_MAX_DEPTH
      ? PUZZLE_DIRS.map(dir => {
          const next = puzzleApplyMove(state, dir);
          let status = 'ok';
          if (!next) status = 'wall';
          else if (parentState && next.join(',') === parentState.join(',')) status = 'parent';
          return { dir, next, status };
        })
      : [];
    const validKids = tries.filter(t => t.status === 'ok');
    let x;
    if (validKids.length === 0) {
      x = leafCounter; leafCounter += 1;
    } else {
      const xs = validKids.map((t, i) => {
        const childId = id + '-' + i;
        edgesOut.push([id, childId]);
        return walk(t.next, depth + 1, childId, state);
      });
      x = xs.reduce((a, b) => a + b, 0) / xs.length;
    }
    const isGoal = state.join(',') === PUZZLE_GOAL.join(',');
    nodesOut.push({ id, state, depth, x, blocked: tries.filter(t => t.status !== 'ok'), isGoal });
    return x;
  };
  walk(PUZZLE_INITIAL, 0, 'proot', null);
  const BOARD = 64, ROWGAP = 130, UNIT = 92, TOP = 55;
  const positions = {};
  nodesOut.forEach(n => { positions[n.id] = { x: UNIT * (n.x + 1), y: TOP + n.depth * ROWGAP }; });
  const totalWidth = UNIT * (leafCounter + 1) + 20;
  const maxDepth = Math.max(...nodesOut.map(n => n.depth));
  const totalHeight = TOP + maxDepth * ROWGAP + BOARD + 30;
  return { nodesOut, edgesOut, positions, totalWidth, totalHeight, BOARD };
};
const puzzleTreeLayout = buildPuzzleTree();

const buildPuzzleOrders = (edgesOut) => {
  const childrenMap = {};

    const id = queue.shift();
    bfsOrder.push(id);
    (childrenMap[id] || []).forEach(c => queue.push(c));
  }
  return { dfsOrder, bfsOrder };
};

const mapDijkstra = (start, goal) => {
  const distances = {}, previous = {}, unvisited = new Set(Object.keys(MAP_NODES));
  Object.keys(MAP_NODES).forEach(n => { distances[n] = Infinity; previous[n] = null; });
  distances[start] = 0;
  while (unvisited.size) {
    let cur = null;
    unvisited.forEach(n => { if (cur === null || distances[n] < distances[cur]) cur = n; });
    if (cur === goal || distances[cur] === Infinity) break;
    unvisited.delete(cur);
    MAP_EDGES.forEach(([a, b, cost]) => {
      let nb = null;
      if (a === cur) nb = b; else if (b === cur) nb = a;
      if (nb && unvisited.has(nb)) {
        const alt = distances[cur] + cost;
        if (alt < distances[nb]) { distances[nb] = alt; previous[nb] = cur; }
      }
    });
  }
  const path = []; let c = goal;
  while (c) { path.unshift(c); c = previous[c]; }
  return { path: path[0] === start ? path : [], cost: distances[goal] };
};
const mapEdgeInPath = (a, b, path) => {
  for (let i = 0; i < path.length - 1; i++) {
    if ((path[i] === a && path[i + 1] === b) || (path[i] === b && path[i + 1] === a)) return true;
  }
  return false;
};

/* ───────────────── 4-Queen 전체 트리 데이터 ───────────────── */
const queenTreeData = {
  children: [
    { col:1, children: [
      { col:2, valid:false },
      { col:3, children: [ { col:2, valid:false }, { col:4, valid:false } ] },
      { col:4, children: [
        { col:2, children: [ { col:3, valid:false } ] },
        { col:3, valid:false },
      ]},
    ]},
    { col:2, children: [
      { col:1, valid:false },
      { col:3, valid:false },
      { col:4, children: [
        { col:1, children: [ { col:3, solution:true } ] },
        { col:3, valid:false },
      ]},
    ]},
    { col:3, children: [
      { col:1, children: [
        { col:2, valid:false },
        { col:4, children: [ { col:2, solution:true } ] },
      ]},
      { col:2, valid:false },
      { col:4, valid:false },
    ]},
    { col:4, children: [
      { col:1, children: [
        { col:2, valid:false },
        { col:3, children: [ { col:2, valid:false } ] },
      ]},
      { col:2, children: [ { col:1, valid:false }, { col:3, valid:false } ] },
      { col:3, valid:false },
    ]},
  ],
};

const QUEEN_BOARD = 50, QUEEN_ROWGAP = 118, QUEEN_WIDTH_UNIT = 66, QUEEN_TOP_MARGIN = 60;
const QUEEN_BRANCH_COLORS = ['#ef4444', '#a855f7', '#7c3aed', '#3b82f6'];
const buildQueenLayout = () => {
  const nodesOut = []; const edgesOut = [];
  let leafCounter = 0;
  const walk = (node, depth, id, parentPath, parentBranch) => {
    const myPath = node.col !== undefined ? [...parentPath, node.col] : parentPath;
    const kids = node.children || [];
    let x;
    if (kids.length === 0) {
      x = leafCounter; leafCounter += 1;
    } else {
      const xs = kids.map((k, i) => {
        const childId = id + '-' + i;
        const childBranch = depth === 0 ? (k.col - 1) : parentBranch;
        edgesOut.push([id, childId, QUEEN_BRANCH_COLORS[childBranch]]);
        return walk(k, depth + 1, childId, myPath, childBranch);
      });
      x = xs.reduce((a, b) => a + b, 0) / xs.length;
    }
    nodesOut.push({ id, col: node.col, valid: node.valid !== false, solution: !!node.solution, depth, x, path: myPath, isLeaf: kids.length === 0 });
    return x;
  };
  walk(queenTreeData, 0, 'root', [], null);
  const positions = {};
  nodesOut.forEach(n => { positions[n.id] = { x: QUEEN_WIDTH_UNIT * (n.x + 1), y: QUEEN_TOP_MARGIN + n.depth * QUEEN_ROWGAP }; });
  const totalWidth = QUEEN_WIDTH_UNIT * (leafCounter + 1) + 20;
  const maxDepth = Math.max(...nodesOut.map(n => n.depth));
  const totalHeight = QUEEN_TOP_MARGIN + maxDepth * QUEEN_ROWGAP + QUEEN_BOARD + 20;
  return { nodesOut, edgesOut, positions, totalWidth, totalHeight };
};
const queenLayout = buildQueenLayout();

/* HTML 이스케이프 (사용자 상태값을 안전하게 문자열로 넣기 위함 - 이 앱은 정적 데이터만 쓰므로 실질적 위험은 없음) */
const esc = (s) => String(s);
/* ═══════════════════════════════════════════
   TreeVisualizer (DFS/BFS 공용) - mode: 'dfs' | 'bfs'
   React의 useState를 지역 변수(클로저)로, useEffect를 재생 타이머로 대체.
   탭을 벗어났다가 다시 들어오면(React 언마운트/마운트와 동일하게) 항상 초기 상태로 새로 시작.
═══════════════════════════════════════════ */
function mountTreeVisualizer(container, mode) {
  const color = mode === 'dfs' ? 'blue' : 'green';
  const c = getColor(color);

  const st = {
    treeSourceMode: 'default',
    nodes: { ...treeNodes },
    edges: [...defaultTreeEdges],
    root: defaultRoot,
    editMode: 'add',
    pendingConnect: null,
    idx: -1,
    playing: false,
    timer: null,
  };

  function stopTimer(){ if (st.timer){ clearInterval(st.timer); st.timer = null; } }

  function computeSteps(){
    const nodeIds = Object.keys(st.nodes);
    const rawAdj = buildAdj(nodeIds, st.edges);
    const adj = {};
    nodeIds.forEach(id => {
      const list = (rawAdj[id] || []).slice();
      list.sort((a, b) => ((st.nodes[a] && st.nodes[a].x) || 0) - ((st.nodes[b] && st.nodes[b].x) || 0));
      adj[id] = list;
    });
    return st.root ? (mode === 'dfs' ? computeDfsSteps(adj, st.root) : computeBfsSteps(adj, st.root)) : [];
  }

  function resetPlay(){ stopTimer(); st.playing = false; st.idx = -1; render(); }
  function nextStep(){
    stopTimer(); st.playing = false;
    const steps = computeSteps();
    st.idx = Math.min(st.idx + 1, steps.length - 1);
    render();
  }
  function startPlaying(){
    st.playing = true; render();
    stopTimer();
    st.timer = setInterval(() => {
      const steps = computeSteps();
      if (st.idx >= steps.length - 1) { stopTimer(); st.playing = false; render(); return; }
      st.idx += 1;
      render();
    }, 900);
  }

  function switchToDefault(){
    stopTimer();
    st.treeSourceMode = 'default'; st.nodes = { ...treeNodes }; st.edges = [...defaultTreeEdges];
    st.root = defaultRoot; st.pendingConnect = null; st.editMode = 'add';
    st.playing = false; st.idx = -1;
    render();
  }
  function switchToRandom(){
    stopTimer();
    const count = 7 + Math.floor(Math.random() * 4);
    const rt = generateRandomTree(count);
    const posObj = {}; rt.nodeIds.forEach(id => { posObj[id] = rt.positions[id]; });
    st.treeSourceMode = 'random'; st.nodes = posObj; st.edges = rt.edges;
    st.root = rt.root; st.pendingConnect = null; st.editMode = 'add';
    st.playing = false; st.idx = -1;
    render();
  }
  function switchToCustom(){
    stopTimer();
    st.treeSourceMode = 'custom'; st.nodes = {}; st.edges = [];
    st.root = null; st.pendingConnect = null; st.editMode = 'add';
    st.playing = false; st.idx = -1;
    render();
  }
  function clearCustom(){
    stopTimer();
    st.nodes = {}; st.edges = []; st.root = null; st.pendingConnect = null;
    st.playing = false; st.idx = -1;
    render();
  }
  function autoArrange(){
    const nodeIds = Object.keys(st.nodes);
    st.nodes = arrangeTreeLayout(nodeIds, st.edges, st.root, st.nodes);
    st.playing = false; st.idx = -1;
    render();
  }
  function nextLabel(){
    const n = Object.keys(st.nodes).length;
    return n < 26 ? String.fromCharCode(65 + n) : ('N' + n);
  }
  function handleSvgClick(e, svgEl){
    if (st.treeSourceMode !== 'custom' || st.editMode !== 'add') return;
    const rect = svgEl.getBoundingClientRect();
    const x = Math.max(30, Math.min(770, (e.clientX - rect.left) * (800 / rect.width)));
    const y = Math.max(30, Math.min(390, (e.clientY - rect.top) * (420 / rect.height)));
    const id = nextLabel();
    const isFirst = Object.keys(st.nodes).length === 0;
    st.nodes = { ...st.nodes, [id]: { x, y } };
    if (isFirst) st.root = id;
    render();
  }
  function handleNodeClick(name, e){
    e.stopPropagation();
    if (st.treeSourceMode !== 'custom') return;
    if (st.editMode === 'start') { st.root = name; render(); return; }
    if (st.editMode === 'connect') {
      if (!st.pendingConnect) { st.pendingConnect = name; render(); return; }
      if (st.pendingConnect === name) { st.pendingConnect = null; render(); return; }
      const exists = st.edges.some(([a, b]) => (a === st.pendingConnect && b === name) || (a === name && b === st.pendingConnect));
      if (exists) {
        st.edges = st.edges.filter(([a, b]) => !((a === st.pendingConnect && b === name) || (a === name && b === st.pendingConnect)));
      } else {
        st.edges = [...st.edges, [st.pendingConnect, name]];
      }
      st.pendingConnect = null;
      render();
    }
  }

  function render(){
    const nodeIds = Object.keys(st.nodes);
    const steps = computeSteps();
    const safeIdx = Math.min(st.idx, steps.length - 1);
    const visited = new Set(steps.slice(0, safeIdx + 1).map(s => s.node));
    const current = safeIdx >= 0 ? steps[safeIdx].node : null;
    const aux = safeIdx >= 0 ? steps[safeIdx].aux : [];
    const nodeYs = Object.values(st.nodes).map(p => p.y);
    const vbHeight = nodeYs.length ? Math.max(420, Math.max(...nodeYs) + 70) : 420;
    const orderSoFar = steps.slice(0, safeIdx + 1).map(s => s.node);

    const editHint = st.editMode === 'add' ? '캔버스의 빈 곳을 클릭하면 새 노드가 추가돼요.'
      : st.editMode === 'connect' ? (st.pendingConnect ? `"${st.pendingConnect}" 노드와 연결(또는 이미 연결되어 있으면 끊기)할 다른 노드를 클릭하세요.` : '연결할 첫 번째 노드를 클릭하세요. (이미 연결된 두 노드를 클릭하면 그 간선만 삭제돼요)')
      : '탐색을 시작할 노드를 클릭해서 시작 노드로 지정하세요.';

    let edgeLines = '';
    st.edges.forEach(([a, b]) => {
      if (st.nodes[a] && st.nodes[b]) {
        edgeLines += `<line x1="${st.nodes[a].x}" y1="${st.nodes[a].y}" x2="${st.nodes[b].x}" y2="${st.nodes[b].y}" stroke="#cbd5e1" stroke-width="3"/>`;
      }
    });
    let nodeCircles = '';
    Object.entries(st.nodes).forEach(([name, pos]) => {
      const isCurrent = name === current;
      const isVisited = visited.has(name);
      const isRoot = name === st.root;
      const isPending = name === st.pendingConnect;
      const fill = isCurrent ? c.solid : isVisited ? '#94a3b8' : isPending ? '#fde68a' : '#ffffff';
      const stroke = isCurrent ? c.solid : isVisited ? '#64748b' : isPending ? '#d97706' : (isRoot ? '#4f46e5' : '#cbd5e1');
      nodeCircles += `
        <g data-node="${name}" class="${isCurrent ? 'pulse-glow' : ''}" style="${isCurrent ? `color:${c.solid};` : ''}cursor:${st.treeSourceMode === 'custom' ? 'pointer' : 'default'};">
          <circle cx="${pos.x}" cy="${pos.y}" r="26" fill="${fill}" stroke="${stroke}" stroke-width="${isRoot ? 5 : 3}"/>
          <text x="${pos.x}" y="${pos.y + 7}" text-anchor="middle" font-size="20" font-weight="bold" fill="${isCurrent || isVisited ? '#ffffff' : '#334155'}">${name}</text>
          ${isRoot ? `<text x="${pos.x}" y="${pos.y - 34}" text-anchor="middle" font-size="16">🚩</text>` : ''}
        </g>`;
    });

    container.innerHTML = `
      <div class="${c.bg} border-2 ${c.border} rounded-xl p-5">
        <div class="flex flex-wrap items-center gap-2 mb-3">
          <span class="text-base font-bold text-gray-600 mr-1">🌳 트리 선택:</span>
          <button data-act="default" class="px-3 py-1.5 rounded-lg font-bold text-base border-2 ${st.treeSourceMode === 'default' ? `${c.btn} text-white border-transparent` : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}">기본 트리</button>
          <button data-act="random" class="px-3 py-1.5 rounded-lg font-bold text-base border-2 ${st.treeSourceMode === 'random' ? `${c.btn} text-white border-transparent` : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}">🎲 무작위 트리 생성</button>
          <button data-act="custom" class="px-3 py-1.5 rounded-lg font-bold text-base border-2 ${st.treeSourceMode === 'custom' ? `${c.btn} text-white border-transparent` : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}">✏️ 내가 만들기</button>
        </div>

        ${st.treeSourceMode === 'custom' ? `
          <div class="bg-white rounded-lg border border-gray-200 p-3 mb-3">
            <div class="flex flex-wrap items-center gap-2 mb-2">
              <button data-mode="add" class="px-3 py-1 rounded-md font-bold text-base ${st.editMode === 'add' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600'}">🔵 노드 추가</button>
              <button data-mode="connect" class="px-3 py-1 rounded-md font-bold text-base ${st.editMode === 'connect' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600'}">🔗 간선 연결</button>
              <button data-mode="start" class="px-3 py-1 rounded-md font-bold text-base ${st.editMode === 'start' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600'}">🚩 시작 노드 지정</button>
              <button id="auto-arrange-btn" ${!st.root ? 'disabled' : ''} class="px-3 py-1 rounded-md font-bold text-base bg-teal-50 text-teal-700 border border-teal-300 hover:bg-teal-100 disabled:opacity-40">🧹 자동 정렬</button>
              <button id="clear-custom-btn" class="px-3 py-1 rounded-md font-bold text-base bg-red-50 text-red-600 border border-red-200 hover:bg-red-100">🗑️ 모두 지우기</button>
              <span class="ml-auto text-base font-bold text-gray-500">🚩 시작 노드: ${st.root || '없음'}</span>
            </div>
            <p class="text-base text-indigo-700 font-bold">👉 ${editHint}</p>
            <p class="text-base text-gray-500 mt-1">💡 DFS는 항상 화면에서 왼쪽에 있는 노드부터 방문해요. 노드가 뒤죽박죽이면 🧹 자동 정렬을 눌러 깔끔하게 정리해보세요!</p>
          </div>` : ''}

        <div class="flex flex-wrap gap-2 mb-4">
          <button id="tv-next-btn" ${steps.length === 0 ? 'disabled' : ''} class="${c.btn} text-white px-4 py-2 rounded-lg font-bold text-base shadow-sm hover:opacity-90 disabled:opacity-40">▶ 한 단계씩</button>
          <button id="tv-play-btn" ${(steps.length === 0 || st.idx >= steps.length - 1) ? 'disabled' : ''} class="bg-gray-700 text-white px-4 py-2 rounded-lg font-bold text-base shadow-sm hover:opacity-90 disabled:opacity-40">⏩ 자동 재생</button>
          <button id="tv-reset-btn" class="bg-white border-2 border-gray-300 text-gray-700 px-4 py-2 rounded-lg font-bold text-base hover:bg-gray-50">🔄 처음부터</button>
        </div>

        <div class="grid md:grid-cols-3 gap-4">
          <div class="md:col-span-2 bg-white rounded-lg border border-gray-200 p-2 overflow-auto" style="max-height:480px">
            <svg id="tv-svg" viewBox="0 0 800 ${vbHeight}" class="w-full" style="min-width:560px;display:block;cursor:${st.treeSourceMode === 'custom' && st.editMode === 'add' ? 'copy' : 'default'};">
              ${edgeLines}
              ${nodeCircles}
            </svg>
            ${st.treeSourceMode === 'custom' && nodeIds.length === 0 ? `<p class="text-center text-base text-gray-400 py-6">캔버스를 클릭해서 첫 번째 노드를 만들어보세요! (첫 노드는 자동으로 시작 노드가 돼요)</p>` : ''}
          </div>

          <div class="space-y-3">
            <div class="bg-white rounded-lg border border-gray-200 p-4">
              <p class="text-base font-bold text-gray-700 mb-2">${mode === 'dfs' ? '📚 재귀 호출 경로 (스택)' : '🧾 대기 목록 (큐)'}</p>
              ${steps.length === 0 ? `<p class="text-base text-gray-400">트리와 시작 노드를 먼저 준비하세요</p>` : ''}
              ${steps.length > 0 && aux.length === 0 && st.idx < 0 ? `<p class="text-base text-gray-400">버튼을 눌러 시작하세요</p>` : ''}
              ${steps.length > 0 && aux.length === 0 && st.idx >= 0 ? `<p class="text-base text-gray-400">비어 있어요 (탐색 종료)</p>` : ''}
              <div class="${mode === 'dfs' ? 'flex flex-col-reverse gap-1' : 'flex flex-wrap gap-1'}">
                ${aux.map(n => `<div class="${c.badge} text-center font-bold rounded-md px-2 py-1 text-base">${n}</div>`).join('')}
              </div>
            </div>
            <div class="bg-white rounded-lg border border-gray-200 p-4">
              <p class="text-base font-bold text-gray-700 mb-2">✅ 방문 순서</p>
              <p class="text-base font-bold ${c.accent} leading-relaxed break-words">${orderSoFar.length ? orderSoFar.join(' → ') : '아직 시작 전이에요'}</p>
              ${st.treeSourceMode === 'custom' && nodeIds.length > steps.length ? `<p class="text-base text-orange-500 mt-2">⚠️ 시작 노드에서 연결되지 않은 노드는 방문되지 않아요!</p>` : ''}
            </div>
          </div>
        </div>
      </div>`;

    // 이벤트 바인딩
    container.querySelector('[data-act="default"]').onclick = switchToDefault;
    container.querySelector('[data-act="random"]').onclick = switchToRandom;
    container.querySelector('[data-act="custom"]').onclick = switchToCustom;
    const autoBtn = container.querySelector('#auto-arrange-btn'); if (autoBtn) autoBtn.onclick = autoArrange;
    const clearBtn = container.querySelector('#clear-custom-btn'); if (clearBtn) clearBtn.onclick = clearCustom;
    container.querySelectorAll('[data-mode]').forEach(btn => {
      btn.onclick = () => { st.editMode = btn.dataset.mode; st.pendingConnect = null; render(); };
    });
    container.querySelector('#tv-next-btn').onclick = nextStep;
    container.querySelector('#tv-play-btn').onclick = startPlaying;
    container.querySelector('#tv-reset-btn').onclick = resetPlay;
    const svgEl = container.querySelector('#tv-svg');
    svgEl.onclick = (e) => handleSvgClick(e, svgEl);
    container.querySelectorAll('[data-node]').forEach(g => {
      g.onclick = (e) => handleNodeClick(g.dataset.node, e);
    });
  }

  render();
  return { stop: stopTimer };
}

function mountAStarGame(container){
  const START = '한비네집', GOAL = '지아네집';
  let path = [START], totalG = 0, finished = false;

  function render(){
    const current = path[path.length - 1];
    const visitedSet = new Set(path);
    const candidates = (graph[current] || [])
      .filter(([n]) => !visitedSet.has(n))
      .map(([n, w]) => ({ name:n, g: totalG + w, h: heur[n], f: totalG + w + heur[n] }));

    container.innerHTML = `
      <div class="bg-white rounded-xl border-2 border-amber-300 p-5">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
          <div>
            <p class="text-base text-gray-500">현재 위치</p>
            <p class="text-xl font-bold text-amber-700">🚩 ${current}</p>
          </div>
          <div class="text-right">
            <p class="text-base text-gray-500">지금까지 이동 거리 g(n)</p>
            <p class="text-xl font-bold text-gray-800">${totalG}</p>
          </div>
        </div>
        <div class="bg-amber-50 rounded-lg p-3 mb-4">
          <p class="text-base font-bold text-amber-800 mb-1">🧭 지나온 경로</p>
          <p class="text-base font-bold text-gray-700">${path.join(' → ')}</p>
        </div>
        ${!finished ? `
          <div>
            <p class="text-base font-bold text-gray-700 mb-2">👇 다음 목적지를 골라보세요 (f(n)이 가장 작은 곳이 유리해요!)</p>
            <div class="grid sm:grid-cols-2 gap-3">
              ${candidates.map(cand => `
                <button data-cand="${cand.name}" class="text-left bg-white border-2 border-amber-200 hover:border-amber-500 hover:bg-amber-50 rounded-lg p-3 transition-all">
                  <p class="font-bold text-gray-800 text-base mb-1">📍 ${cand.name}</p>
                  <p class="text-base text-gray-600">g=${cand.g} + h=${cand.h} = <span class="font-bold text-amber-700">f=${cand.f}</span></p>
                </button>`).join('')}
              ${candidates.length === 0 ? `<p class="text-base text-gray-400">더 이상 갈 곳이 없어요. 처음부터 다시 해보세요!</p>` : ''}
            </div>
          </div>` : (() => {
            const isOptimal = totalG === OPTIMAL_COST;
            return `
            <div class="pop-in text-center p-5 rounded-xl border-2 ${isOptimal ? 'bg-green-50 border-green-300' : 'bg-orange-50 border-orange-300'}">
              <p class="text-4xl mb-2">${isOptimal ? '🏆' : '🤔'}</p>
              <p class="text-xl font-bold mb-1" style="color:${isOptimal ? '#15803d' : '#c2410c'}">
                ${isOptimal ? '정답! 가장 짧은 최적 경로를 찾았어요!' : `지아네 집 도착! 총 이동 거리: ${totalG}`}
              </p>
              <p class="text-base text-gray-600">
                ${isOptimal ? 'A* 알고리즘처럼 f(n)이 가장 작은 길을 잘 선택했어요 👍' : `가장 짧은 거리는 ${OPTIMAL_COST}이에요. f(n) 점수를 비교해서 다시 도전해 보세요!`}
              </p>
            </div>`;
          })()}
        <div class="text-center mt-4">
          <button id="ag-restart" class="bg-gray-700 text-white px-5 py-2 rounded-lg font-bold text-base hover:bg-gray-800">🔄 처음부터 다시하기</button>
        </div>
      </div>`;

    container.querySelectorAll('[data-cand]').forEach(btn => {
      btn.onclick = () => {
        const cand = candidates.find(c => c.name === btn.dataset.cand);
        path = [...path, cand.name];
        totalG = cand.g;
        if (cand.name === GOAL) finished = true;
        render();
      };
    });
    container.querySelector('#ag-restart').onclick = () => { path = [START]; totalG = 0; finished = false; render(); };
  }
  render();
}

/* ═══════════════════════════════════════════

function mountAStarIllustratedMap(container){

                <g opacity="0.25"><circle cx="190" cy="220" r="14" fill="#15803d"/><circle cx="208" cy="215" r="18" fill="#16a34a"/><circle cx="200" cy="228" r="12" fill="#22c55e"/></g>
                <g opacity="0.25"><circle cx="570" cy="350" r="14" fill="#15803d"/><circle cx="588" cy="345" r="18" fill="#16a34a"/><circle cx="580" cy="358" r="12" fill="#22c55e"/></g>

/* ═══════════════════════════════════════════
   4x4 미니 체스판
═══════════════════════════════════════════ */
function queenMiniBoardHtml(path, invalid, solution){
  const cell = QUEEN_BOARD / 4;
  const borderClass = solution ? 'border-4 border-amber-500 ring-4 ring-amber-300'
    : invalid ? 'border-2 border-red-400' : 'border-2 border-slate-300';
  let cells = '';
  for (let i = 0; i < 16; i++){
    const r = Math.floor(i / 4), c = i % 4;
    const hasQueen = path[r] !== undefined && (path[r] - 1) === c;
    const dark = (r + c) % 2 === 1;
    const bg = invalid ? (dark ? '#fecaca' : '#fee2e2') : (dark ? '#cbd5e1' : '#f1f5f9');
    cells += `<div style="width:${cell}px;height:${cell}px;background-color:${bg}" class="flex items-center justify-center">
      ${hasQueen ? `<span style="font-size:${cell * 0.75}px;color:${invalid ? '#b91c1c' : '#334155'}">♜</span>` : ''}</div>`;
  }
  return `<div class="grid grid-cols-4 rounded-md overflow-hidden ${borderClass} ${solution ? 'shadow-lg shadow-amber-300 pulse-glow text-amber-500' : ''}" style="width:${QUEEN_BOARD}px;height:${QUEEN_BOARD}px">${cells}</div>`;
}

/* ═══════════════════════════════════════════
   4-Queen 전체 트리
═══════════════════════════════════════════ */
function queenFullTreeSvgHtml(){
  const { nodesOut, edgesOut, positions, totalWidth, totalHeight } = queenLayout;
  const rootPos = positions['root'];
  const solutionNodes = nodesOut.filter(n => n.solution);

  const rootLabel = `<div class="absolute bg-emerald-500 text-white text-xs font-bold px-2 py-1 rounded" style="left:${rootPos.x - QUEEN_BOARD / 2}px;top:${rootPos.y - QUEEN_BOARD / 2 - 26}px">초기 상태</div>`;
  const solLabels = solutionNodes.map(n => `<div class="absolute bg-amber-500 text-white text-xs font-bold px-2 py-1 rounded whitespace-nowrap" style="left:${positions[n.id].x - 26}px;top:${positions[n.id].y - QUEEN_BOARD / 2 - 26}px">⭐ 목표 상태</div>`).join('');

  const polylines = edgesOut.map(([a, b, color]) => {
    const pa = positions[a], pb = positions[b];
    const topA = pa.y + QUEEN_BOARD / 2, botB = pb.y - QUEEN_BOARD / 2;
    const midY = (topA + botB) / 2;
    return `<polyline points="${pa.x},${topA} ${pa.x},${midY} ${pb.x},${midY} ${pb.x},${botB}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
  }).join('');

  const boards = nodesOut.map(n => {
    const p = positions[n.id];
    return `<div class="absolute" style="left:${p.x - QUEEN_BOARD / 2}px;top:${p.y - QUEEN_BOARD / 2}px">${queenMiniBoardHtml(n.path, n.valid === false, n.solution)}</div>`;
  }).join('');

  return `
    <div class="bg-white rounded-lg border-2 border-amber-300 p-4 mt-3 overflow-x-auto">
      <div style="position:relative;width:${totalWidth}px;height:${totalHeight + 34}px">
        ${rootLabel}

        <span class="flex items-center gap-1"><span class="inline-block w-4 h-4 rounded border-2 border-red-400 bg-red-100"></span> 서로 공격해서 실패 (가지치기)</span>

/* ═══════════════════════════════════════════
   8-퍼즐 탐색 트리 (DFS/BFS) - 재생 버튼 있음
═══════════════════════════════════════════ */
function mountPuzzleTreeSvg(container, theme = 'indigo', mode = 'dfs'){
  const t = PUZZLE_THEME[theme];
  const { nodesOut, edgesOut, positions, totalWidth, totalHeight, BOARD } = puzzleTreeLayout;
  const goalNode = nodesOut.find(n => n.isGoal);
  const order = mode === 'dfs' ? PUZZLE_DFS_ORDER : PUZZLE_BFS_ORDER;
  const orderIndexOf = (id) => order.indexOf(id);

  let idx = -1, playing = false, timer = null;
  function stopTimer(){ if (timer){ clearInterval(timer); timer = null; } }

  function render(){
    const visited = new Set(order.slice(0, idx + 1));
    const currentId = idx >= 0 ? order[idx] : null;

    const polylines = edgesOut.map(([a, b]) => {
      const pa = positions[a], pb = positions[b];
      const topA = pa.y + BOARD/2, botB = pb.y - BOARD/2;
      const midY = (topA + botB) / 2;
      const bothVisited = visited.has(a) && visited.has(b);
      const stroke = bothVisited ? t.stroke : '#e2e8f0';
      const width = bothVisited ? 2.5 : 1.5;
      return `<polyline points="${pa.x},${topA} ${pa.x},${midY} ${pb.x},${midY} ${pb.x},${botB}" fill="none" stroke="${stroke}" stroke-width="${width}"/>`;
    }).join('');

    const boards = nodesOut.map(n => {
      const p = positions[n.id];
      const isVisited = visited.has(n.id);
      const isCurrent = n.id === currentId;
      const stepNum = orderIndexOf(n.id) + 1;
      const blockedHtml = n.blocked.length > 0 ? `
        <div class="flex flex-wrap gap-1 justify-center mt-1" style="width:130px">
          ${n.blocked.map(b => `<span class="text-xs font-bold px-1.5 py-0.5 rounded ${b.status === 'wall' ? 'bg-gray-200 text-gray-500' : 'bg-orange-100 text-orange-600'}">${b.dir.key} ${b.status === 'wall' ? '🧱벽' : '↩이전'}</span>`).join('')}
        </div>` : '';
      return `
        <div class="absolute flex flex-col items-center" style="left:${p.x - BOARD/2}px;top:${p.y - BOARD/2}px;width:${BOARD}px">
          <div class="relative">
            <div class="absolute -left-2 -top-2 z-10 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold text-white ${isCurrent ? 'bg-rose-500 scale-125 pulse-glow' : theme === 'green' ? 'bg-green-500' : 'bg-indigo-500'}" style="${isCurrent ? 'color:#f43f5e;' : ''}">
              ${isVisited ? stepNum : ''}
            </div>
            ${puzzleMiniBoardHtml(n.state, BOARD, n.id === 'proot' || isCurrent, n.isGoal && isVisited, theme)}
          </div>
          ${blockedHtml}
        </div>`;
    }).join('');

    container.innerHTML = `
      <div class="${t.bg} border-2 ${t.bgBorder} rounded-xl p-4">
        <div class="flex flex-wrap gap-2 mb-4">
          <button id="pt-next" ${idx >= order.length - 1 ? 'disabled' : ''} class="${theme === 'green' ? 'bg-green-600' : 'bg-indigo-600'} text-white px-4 py-2 rounded-lg font-bold text-base shadow-sm hover:opacity-90 disabled:opacity-40">▶ 한 단계씩</button>
          <button id="pt-play" ${idx >= order.length - 1 ? 'disabled' : ''} class="bg-gray-700 text-white px-4 py-2 rounded-lg font-bold text-base shadow-sm hover:opacity-90 disabled:opacity-40">⏩ 자동 재생</button>
          <button id="pt-reset" class="bg-white border-2 border-gray-300 text-gray-700 px-4 py-2 rounded-lg font-bold text-base hover:bg-gray-50">🔄 처음부터</button>
        </div>
        <div class="bg-white rounded-lg border border-gray-200 p-3 overflow-x-auto">
          <div style="position:relative;width:${totalWidth}px;height:${totalHeight}px">
            <svg width="${totalWidth}" height="${totalHeight}" style="position:absolute;top:0;left:0;pointer-events:none">${polylines}</svg>
            ${boards}
          </div>
        </div>
        <div class="flex flex-wrap gap-4 justify-center text-base mt-3 border-t border-gray-100 pt-3">
          <span class="flex items-center gap-1"><span class="inline-block w-4 h-4 rounded border-2 ${t.border}"></span> 초기 상태(뿌리)</span>
          <span class="flex items-center gap-1"><span class="w-5 h-5 rounded-full bg-rose-500 text-white text-xs font-bold flex items-center justify-center">n</span> 방문 순서 번호</span>
          <span class="flex items-center gap-1"><span class="inline-block w-4 h-4 rounded border-4 border-amber-500"></span> 🎯 목표 상태(정답)</span>
          <span class="flex items-center gap-1"><span class="px-1.5 py-0.5 rounded bg-gray-200 text-gray-500 text-xs font-bold">🧱벽</span> 판 밖이라 이동 불가</span>
          <span class="flex items-center gap-1"><span class="px-1.5 py-0.5 rounded bg-orange-100 text-orange-600 text-xs font-bold">↩이전</span> 바로 직전 상태로 되돌아가서 건너뜀</span>
        </div>
      </div>`;

    container.querySelector('#pt-next').onclick = () => { stopTimer(); idx = Math.min(idx + 1, order.length - 1); render(); };
    container.querySelector('#pt-play').onclick = () => {
      stopTimer();
      timer = setInterval(() => {
        if (idx >= order.length - 1) { stopTimer(); render(); return; }
        idx += 1; render();
      }, 700);
    };
    container.querySelector('#pt-reset').onclick = () => { stopTimer(); idx = -1; render(); };
  }
  render();
}

/* ═══════════════════════════════════════════
   8-퍼즐 사운드 효과 (Web Audio API)
═══════════════════════════════════════════ */
let puzzleAudioCtxSingleton = null;
function getPuzzleAudioCtx(){
  if (!puzzleAudioCtxSingleton) {
    puzzleAudioCtxSingleton = new (window.AudioContext || window.webkitAudioContext)();
  }
  return puzzleAudioCtxSingleton;
}

/* 타일 이동 소리: 짧은 "딱!" 클릭 음 */
function playMoveSound(){
  try {
    const ctx = getPuzzleAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.06);

    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);

    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.13);
  } catch (e) {}
}

/* 퍼즐 완성 소리: 밝은 팡파르 3음 */
function playWinSound(){
  try {
    const ctx = getPuzzleAudioCtx();
    const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      const t = ctx.currentTime + i * 0.13;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);

      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.4, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);

      osc.start(t);
      osc.stop(t + 0.46);
    });
  } catch (e) {}
}

/* ═══════════════════════════════════════════
   8-퍼즐 직접 플레이하기
═══════════════════════════════════════════ */
function mountSlidingPuzzleGame(container){
  function shuffleFrom(goal){
    let s = goal.slice();
    let last = -1;
    for (let i = 0; i < 60; i++) {
      const blankIdx = s.indexOf(0);
      const opts = PUZZLE_DIRS
        .map((d, di) => ({ d, di, next: puzzleApplyMove(s, d) }))
        .filter(o => o.next && o.di !== last);
      if (opts.length === 0) continue;
      const pick = opts[Math.floor(Math.random() * opts.length)];
      s = pick.next;
      last = pick.di === 0 ? 1 : pick.di === 1 ? 0 : pick.di === 3 ? 2 : 3;
    }
    return s;
  }

  let board = shuffleFrom(PUZZLE_GOAL), moves = 0;

  function render(){
    const solved = board.every((v, i) => v === PUZZLE_GOAL[i]);
    const tiles = board.map((v, i) => `
      <button data-tile="${i}" ${v === 0 ? 'disabled' : ''}
        class="h-[64px] rounded-lg text-2xl font-bold transition-all ${v === 0 ? 'bg-transparent cursor-default' : 'bg-white text-indigo-700 shadow hover:bg-indigo-50 active:scale-95 cursor-pointer'}">
        ${v !== 0 ? v : ''}
      </button>`).join('');

    container.innerHTML = `
      <div class="bg-white rounded-xl border-2 border-indigo-300 p-5">
        <div class="flex items-center justify-between mb-3">
          <p class="text-base font-bold text-gray-700">🎮 움직인 횟수: <span class="text-indigo-600">${moves}</span></p>
          <button id="sp-reshuffle" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-base hover:bg-indigo-700">🔀 섞기</button>
        </div>
        <div class="grid grid-cols-3 gap-1.5 bg-slate-200 p-2 rounded-xl mx-auto" style="width:220px">${tiles}</div>
        ${solved ? `
          <div class="pop-in text-center mt-4 bg-green-50 border-2 border-green-300 rounded-xl p-3">
            <p class="text-2xl mb-1">🎉</p>
            <p class="font-bold text-green-700">완성! ${moves}번 만에 맞췄어요!</p>
          </div>` : ''}
        <p class="text-center text-base text-gray-500 mt-3">빈 칸과 붙어 있는 숫자를 클릭하면 그 칸으로 밀려 들어가요. 숫자를 1~8 순서로, 빈 칸이 맨 마지막(오른쪽 아래)에 오도록 맞춰보세요!</p>
      </div>`;

    const solvedNow = board.every((v, i) => v === PUZZLE_GOAL[i]);
    container.querySelectorAll('[data-tile]').forEach(btn => {
      btn.onclick = () => {
        if (solvedNow) return;
        const i = parseInt(btn.dataset.tile, 10);
        const blankIdx = board.indexOf(0);
        const [r1, c1] = puzzleRC(i), [r2, c2] = puzzleRC(blankIdx);
        const adjacent = (Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1;
        if (!adjacent) return;
        const next = board.slice();
        next[blankIdx] = board[i]; next[i] = 0;
        playMoveSound(); // 🔊 타일 이동 소리
        const willSolve = next.every((v, idx) => v === PUZZLE_GOAL[idx]);
        if (willSolve) setTimeout(playWinSound, 80); // 🎉 완성 팡파르
        board = next; moves += 1;
        render();
      };
    });
    container.querySelector('#sp-reshuffle').onclick = () => { board = shuffleFrom(PUZZLE_GOAL); moves = 0; render(); };
  }
  render();
}

function mountHillClimbDemo(container){

      return { dir: d.key, label: d.label, state: next, f: puzzleHeuristic(next) };

    const openCands = candidates.filter(c => !c.wall);

              <button id="hc-stuck-btn" class="flex flex-col items-center justify-center gap-1 rounded-lg p-2 border-2 border-dashed border-gray-300 bg-white hover:border-gray-500 w-28">

              : '이웃 중에 지금보다 더 좋은 곳이 없어서 여기서 멈췄어요. 언덕 등반은 이런 상황(지역 최적점)에 잘 빠지는 게 가장 큰 단점이에요.'}
          </p>
          <div class="flex justify-center gap-3">
            <button id="hc-reset-init" class="bg-gray-200 px-4 py-2 rounded-lg font-bold">🔄 성공 사례 다시 보기</button>
            ${scenario !== 'trap' ? `<button id="hc-reset-trap" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-bold">🧗 함정 체험하기</button>` : ''}
          </div>
        </div>`;
    }

    container.innerHTML = `
      <div class="space-y-4">
        <div class="bg-white border-2 border-orange-200 rounded-xl p-5">
          <div class="flex flex-wrap items-center gap-6">
            <div class="text-center">
              <p class="text-base font-bold text-gray-600 mb-2">현재 상태</p>
              ${puzzleMiniBoardHtml(current, 160, true, false, 'orange')}
              <p class="mt-2 text-lg font-bold text-orange-600">f(n) = ${currentF}</p>

                이웃 중에서 <b>현재보다 f(n)이 더 낮은(더 좋은) 곳이 있으면</b> 그쪽으로 한 걸음 이동하고,
                <b> 더 좋은 이웃이 하나도 없으면 그 자리에서 멈춰요.</b> 지나온 길 전체를 기억하지 않아요!
              </p>
            </div>
          </div>
        </div>
        ${statusHtml}
      </div>`;

    container.querySelectorAll('[data-cand]').forEach(btn => {
      btn.onclick = () => { pickKey = btn.dataset.cand; revealed = true; render(); };
    });
    const stuckBtn = container.querySelector('#hc-stuck-btn');
    if (stuckBtn) stuckBtn.onclick = () => { pickKey = '__stuck__'; revealed = true; render(); };
    const nextBtn = container.querySelector('#hc-next-btn');
    if (nextBtn) nextBtn.onclick = () => {
      if (correctIsStuck) { status = 'stuck'; render(); return; }
      current = best.state;
      history = [...history, { state: best.state, moveLabel: best.label, caption: `${best.label} (f=${best.f})` }];
      revealed = false; pickKey = null;
      if (isGoalState(best.state)) status = 'goal';
      render();
    };
    const resetInit = container.querySelector('#hc-reset-init');
    if (resetInit) resetInit.onclick = () => doReset(PUZZLE_INITIAL);
    const resetTrap = container.querySelector('#hc-reset-trap');
    if (resetTrap) resetTrap.onclick = () => doReset(TRAP_START);
  }

  function doReset(s){
    current = s;
    history = [{ state: s, moveLabel: '시작', caption: startCaption(s) }];
    revealed = false; pickKey = null; status = 'playing';
    scenario = (s === TRAP_START) ? 'trap' : 'success';
    render();
  }

  render();
}

/* ═══════════════════════════════════════════
   최상 우선 탐색 / A* 공용 프론티어 체험
═══════════════════════════════════════════ */
function mountFrontierDemo(container, mode){
  const scoreOf = (n) => mode === 'astar' ? n.g + n.h : n.h;
  const initNode = { state: PUZZLE_INITIAL, g: 0, h: puzzleHeuristic(PUZZLE_INITIAL), parentKey: null };
  let open = [initNode], trail = [], revealed = false, pickKey = null, status = 'playing', count = 0;

  const label = mode === 'astar' ? 'f(n) = g(n)+h(n)' : 'f(n) = h(n)';
  const btn = mode === 'astar' ? 'bg-amber-500' : 'bg-teal-600';
  const theme = mode === 'astar' ? 'amber' : 'teal';

  function render(){
    const sorted = [...open].sort((a, b) => scoreOf(a) - scoreOf(b));
    const bestNode = sorted[0];

    let trailBar = '';
    if (trail.length > 0 && status !== 'goal') {
      trailBar = `
        <div class="bg-white border-2 border-gray-200 rounded-xl p-4 overflow-x-auto">
          <p class="text-base font-bold text-gray-600 mb-2">✅ 지금까지 확장한 노드 (경로)</p>
          <div class="flex items-center gap-2">
            ${trail.map((n, i) => `
              <div class="text-center">${puzzleMiniBoardHtml(n.state, 100, false, false, theme)}<p class="text-sm text-gray-500 mt-1">f=${scoreOf(n)}</p></div>
              ${i < trail.length - 1 ? `<span class="text-gray-400">→</span>` : ''}`).join('')}
          </div>
        </div>`;
    }

    let statusHtml = '';
    if (status === 'playing') {
      statusHtml = `
        <div class="border-2 rounded-xl p-5 slide-in ${mode === 'astar' ? 'bg-amber-50 border-amber-300' : 'bg-teal-50 border-teal-300'}">
          <p class="font-bold text-gray-800 mb-1">📋 열린 목록(OPEN) — 아직 확장하지 않은 후보들</p>
          <p class="text-base text-gray-600 mb-3">이 중에서 <b>${label}가 가장 작은</b> 노드를 클릭해서 예측해보세요!</p>
          <div class="flex flex-wrap gap-3">
            ${sorted.map(n => {
              const k = puzzleStateKey(n.state);
              const isBest = bestNode && puzzleStateKey(bestNode.state) === k;
              const isUser = pickKey === k;
              let border = 'border-gray-200 bg-white hover:-translate-y-0.5';
              if (revealed && isBest) border = 'border-green-400 bg-green-50';
              else if (revealed && isUser) border = 'border-red-400 bg-red-50';
              return `
                <button data-open-key="${k}" ${revealed ? 'disabled' : ''} class="flex flex-col items-center gap-1 rounded-lg p-2 border-2 transition-all ${border}">
                  ${puzzleMiniBoardHtml(n.state, 115, false, false, theme)}
                  ${mode === 'astar' ? `<span class="text-sm text-gray-500">g=${n.g}, h=${n.h}</span>` : ''}
                  <span class="text-base font-bold ${revealed && isBest ? 'text-green-600' : 'text-gray-700'}">f = ${scoreOf(n)}</span>
                  ${revealed && isBest ? `<span class="text-sm text-green-700 font-bold">✅ 가장 작음</span>` : ''}
                  ${revealed && isUser && !isBest ? `<span class="text-sm text-red-600 font-bold">내 예측</span>` : ''}
                </button>`;
            }).join('')}
          </div>
          ${revealed ? `
            <div class="slide-in mt-4 bg-white rounded-lg p-3 border border-gray-200">
              <p class="text-base text-gray-700">
                💡 ${mode === 'astar'
                  ? `이 노드는 <b>지금까지 걸어온 거리 g=${bestNode.g}</b>와 <b>남은 거리 예측 h=${bestNode.h}</b>을 더한 <b>f=${bestNode.g + bestNode.h}</b>가 가장 작아요. A*는 이 노드를 다음으로 확장해요.`
                  : `이 노드는 <b>f(n) = h(n) = ${bestNode.h}</b>이 가장 작아요. 최상 우선 탐색은 걸어온 거리는 신경 쓰지 않고, 오직 f가 가장 작은 노드를 다음으로 확장해요.`}
              </p>
              <button id="fd-expand-btn" class="mt-3 text-white font-bold px-4 py-2 rounded-lg ${btn}">이 노드 확장하기 →</button>
            </div>` : ''}
        </div>`;
    } else if (status === 'goal') {
      const finalSteps = trail.map((n, i) => {
        if (i === 0) return { state: n.state, moveLabel: '시작', caption: `시작 (f=${scoreOf(n)})` };
        const mv = directionBetween(trail[i - 1].state, n.state) || '이동';
        return { state: n.state, moveLabel: mv, caption: `${mv} (f=${scoreOf(n)})` };
      });
      statusHtml = `
        <div class="space-y-4">
          <div class="pop-in bg-green-50 border-2 border-green-300 rounded-xl p-5 text-center">
            <div class="text-4xl mb-2">🏆</div>
            <p class="text-lg font-bold text-green-800 mb-1">목표 상태를 찾았어요! (총 이동 횟수 = ${trail[trail.length - 1].g})</p>
            <p class="text-base text-gray-600 mb-3">OPEN 목록 전체를 기억하고 있었기 때문에, 중간에 이웃이 별로였던 순간에도 막히지 않고 계속 탐색할 수 있었어요.</p>
            <button id="fd-reset-btn" class="bg-gray-200 px-4 py-2 rounded-lg font-bold">🔄 다시 체험</button>
          </div>
          ${finalPathTreeHtml(finalSteps, theme)}
        </div>`;
    } else if (status === 'limit') {
      statusHtml = `
        <div class="pop-in bg-yellow-50 border-2 border-yellow-300 rounded-xl p-5 text-center">
          <p class="text-base text-gray-700 mb-3">체험판에서는 최대 8단계까지만 진행해요. 여기까지의 흐름으로도 충분히 원리를 확인할 수 있어요!</p>
          <button id="fd-reset-btn" class="bg-gray-200 px-4 py-2 rounded-lg font-bold">🔄 다시 체험</button>
        </div>`;
    }

    container.innerHTML = `<div class="space-y-4">${trailBar}${statusHtml}</div>`;

    container.querySelectorAll('[data-open-key]').forEach(b => {
      b.onclick = () => { pickKey = b.dataset.openKey; revealed = true; render(); };
    });
    const expandBtn = container.querySelector('#fd-expand-btn');
    if (expandBtn) expandBtn.onclick = () => {
      if (!bestNode) { status = 'limit'; render(); return; }
      const rest = open.filter(n => puzzleStateKey(n.state) !== puzzleStateKey(bestNode.state));
      trail = [...trail, bestNode];
      if (isGoalState(bestNode.state)) { open = rest; status = 'goal'; revealed = false; pickKey = null; render(); return; }
      const kids = [];
      PUZZLE_DIRS.forEach(d => {
        const nxt = puzzleApplyMove(bestNode.state, d);
        if (!nxt) return;
        if (bestNode.parentKey && puzzleStateKey(nxt) === bestNode.parentKey) return;
        if (rest.some(n => puzzleStateKey(n.state) === puzzleStateKey(nxt))) return;
        kids.push({ state: nxt, g: bestNode.g + 1, h: puzzleHeuristic(nxt), parentKey: puzzleStateKey(bestNode.state) });
      });
      count += 1;
      open = [...rest, ...kids];
      revealed = false; pickKey = null;
      if (count >= 8) status = 'limit';
      render();
    };
    const resetBtn = container.querySelector('#fd-reset-btn');
    if (resetBtn) resetBtn.onclick = () => {
      open = [initNode]; trail = []; revealed = false; pickKey = null; status = 'playing'; count = 0;
      render();
    };
  }
  render();
}

/* ═══════════════════════════════════════════

      </p>

          <p class="text-sm text-gray-500 mb-1">시작 상태</p>

        <div class="text-base text-gray-700 leading-relaxed">
          하나씩 세어보면 <b>1, 2, 8의 위치가 목표와 달라요</b> → <span class="text-lg font-bold text-indigo-600">h = f = 3</span>
        </div>
        <div class="text-center">
          <p class="text-sm text-gray-500 mb-1">목표 상태</p>
          ${puzzleMiniBoardHtml(PUZZLE_GOAL, 135, false, true, 'indigo')}

        </div>
      </div>
    </div>`;
}

                <li>• 하지만 최적 경로를 놓칠 수 있어요</li>
              </ul>

            </div>
          </div>
          <p class="text-base text-slate-200 leading-relaxed mt-4">

            반대로 h(n)이 <b class="text-white">실제보다 크게(과대평가)</b> 예측되면 탐색은 빨라지지만, <b class="text-white">더 좋은 길을 성급하게 놓쳐서 최적 경로를 보장하지 못할 수 있어요.</b>
            그래서 A*는 h(n)이 실제 거리보다 크지 않은(=과소평가하는) 휴리스틱을 쓸 때만 "항상 최적 경로를 찾는다"고 보장할 수 있어요.
          </p>
        </div>
      </div>`;

    container.querySelector('#sparrow-trigger').onclick = () => {
      showSparrow = true; render();
      clearTimeout(sparrowTimer);
      sparrowTimer = setTimeout(() => { showSparrow = false; render(); }, 500);
    };
  }
  render();
}

                  }
                  return `
                    <button data-quiz="${q.id}" data-idx="${idx}" ${answered ? 'disabled' : ''} class="w-full text-left px-4 py-3 rounded-lg border-2 text-base transition-all ${style} ${answered ? 'cursor-default' : 'cursor-pointer'}">
                      <span class="font-bold mr-2">${['①','②','③','④'][idx]}</span>${opt}
                      ${answered && idx === q.ans ? `<span class="ml-2">✅</span>` : ''}
                      ${answered && idx === quizAnswers[q.id] && idx !== q.ans ? `<span class="ml-2">❌</span>` : ''}
                    </button>`;
                }).join('')}
              </div>
              ${answered ? `
                <div class="p-3 rounded-lg text-base leading-relaxed ${quizAnswers[q.id] === q.ans ? 'bg-green-50 border border-green-300 text-green-800' : 'bg-orange-50 border border-orange-300 text-orange-800'}">
                  ${quizAnswers[q.id] === q.ans ? '🎉 정답이에요! ' : '💡 정답 설명: '}${q.expl}
                </div>` : ''}
            </div>`;
        }).join('')}
        ${answeredCount === quizData.length ? `
          <div class="slide-in bg-gradient-to-r from-indigo-50 to-violet-50 p-6 rounded-xl border-2 border-indigo-300 text-center">
            <div class="text-5xl mb-3">${calcScore() === quizData.length ? '🏆' : calcScore() >= 4 ? '🌟' : calcScore() >= 2 ? '👍' : '📚'}</div>
            <p class="text-2xl font-bold text-indigo-800 mb-2">${calcScore()} / ${quizData.length} 점</p>
            <p class="text-base text-gray-600">${calcScore() === quizData.length ? '완벽해요! 탐색 알고리즘 마스터예요! 🏆' : calcScore() >= 4 ? '잘했어요! 거의 다 맞혔네요 👍' : calcScore() >= 2 ? '조금만 더 복습해봐요! 💪' : '다시 한번 처음부터 배워봐요! 📖'}</p>
          </div>` : ''}
      </div>`;

    el.querySelectorAll('[data-quiz]').forEach(btn => {
      btn.onclick = () => {
        const qid = parseInt(btn.dataset.quiz, 10);
        const idx = parseInt(btn.dataset.idx, 10);
        if (quizAnswers[qid] !== undefined) return;
        const q = quizData.find(q => q.id === qid);
        if (idx !== q.ans) { shakeId = qid; setTimeout(() => { shakeId = null; renderTabContent(); }, 400); }
        quizAnswers = { ...quizAnswers, [qid]: idx };
        renderTabContent();
      };
    });
    const retryBtn = el.querySelector('#quiz-retry-all');
    if (retryBtn) retryBtn.onclick = () => { quizAnswers = {}; renderTabContent(); };
    return;
  }
}

/* ═══════════════════════════════════════════
   초기 실행
═══════════════════════════════════════════ */
renderHeader();
renderTabButtons();
renderTabContent();

</script>
</body>
</html>
