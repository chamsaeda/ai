    );

    /* ═════════════ 탭5: Orange 실습 ═════════════ */
    /* 산점도 점 위치는 이진분류훈련.csv / 다중분류훈련.csv 값과 같아요. */
    const PTS_JJAJANG = [[1.5,1.8],[1.6,1.4],[1.7,2.2],[1.8,1.3],[2.0,2.3],[2.1,2.0],[2.3,1.7],[2.5,2.8],[3.0,3.8],[3.2,3.3],[3.8,3.5],[3.8,4.0],[4.5,1.2],[5.0,1.6],[5.5,2.0]];
    const PTS_JJAMPPONG = [[3.5,6.1],[3.9,6.0],[5.0,4.0],[5.2,5.5],[5.4,5.9],[5.6,5.4],[5.8,5.3],[6.0,6.3],[6.1,6.0],[6.3,5.7],[6.5,6.8],[6.8,6.5],[7.0,4.0],[7.1,7.5],[7.2,7.1]];
    const PTS_JJOLMYEON = [[6.2,2.5],[6.3,3.1],[6.4,2.9],[6.5,2.8],[6.6,2.4],[6.7,3.2],[6.8,2.3],[6.9,2.6],[7.0,3.3],[7.1,3.0],[7.2,2.8],[7.3,2.7]];
    const TEST_ROWS = [
      { n: 1, x: 4.5, y: 4.5, truth: '짜장' },
      { n: 2, x: 4.5, y: 3.0, truth: '짜장' },
      { n: 3, x: 4.5, y: 6.0, truth: '짬뽕' },
      { n: 4, x: 7.0, y: 1.0, truth: '짜장' },
    ];

    /* 트리 규칙 (Orange Tree Viewer 결과) */
    const treeSteps = (group, x, y) => {
      if (group === 2) {
        if (y <= 3.8) return { result: '짜장', steps: [`물의 양 ${y.toFixed(1)} ≤ 3.8 ? → 예`] };
        if (x <= 3.8) return { result: '짜장', steps: [`물의 양 ${y.toFixed(1)} ≤ 3.8 ? → 아니오`, `매운 정도 ${x.toFixed(1)} ≤ 3.8 ? → 예`] };
        return { result: '짬뽕', steps: [`물의 양 ${y.toFixed(1)} ≤ 3.8 ? → 아니오`, `매운 정도 ${x.toFixed(1)} ≤ 3.8 ? → 아니오`] };
      }
      if (y > 3.8) return { result: '짬뽕', steps: [`물의 양 ${y.toFixed(1)} ≤ 3.8 ? → 아니오`] };
      if (x <= 5.5) return { result: '짜장', steps: [`물의 양 ${y.toFixed(1)} ≤ 3.8 ? → 예`, `매운 정도 ${x.toFixed(1)} ≤ 5.5 ? → 예`] };
      return { result: '쫄면', steps: [`물의 양 ${y.toFixed(1)} ≤ 3.8 ? → 예`, `매운 정도 ${x.toFixed(1)} ≤ 5.5 ? → 아니오`] };
    };
    const TREE_2 = {
      q: '물의 양이 3.8 이하?',
      yes: { r: '짜장 100% (14/14)' },
      no: { q: '매운 정도가 3.8 이하?', yes: { r: '짜장 50% (1/2)' }, no: { r: '짬뽕 100% (14/14)' } },
    };
    const TREE_3 = {
      q: '물의 양이 3.8 이하?',
      yes: { q: '매운 정도가 5.5 이하?', yes: { r: '짜장 100% (14/14)' }, no: { r: '쫄면 100% (12/12)' } },
      no: { r: '짬뽕 93.8% (15/16)' },
    };
    /* kNN, SVM, Tree 예측 (수업 자료의 Predictions 화면) */
    const ORANGE_PRED = {
      2: { knn: ['짬뽕', '짜장', '짬뽕', '짜장'], svm: ['짬뽕', '짜장', '짬뽕', '짜장'], tree: ['짬뽕', '짜장', '짬뽕', '짜장'] },
      3: { knn: ['짬뽕', '짜장', '짬뽕', '쫄면'], svm: ['짬뽕', '짜장', '짬뽕', '쫄면'], tree: ['짬뽕', '짜장', '짬뽕', '쫄면'] },
    };

    const ScatterPlot = ({ group, showTest, probe, showLines = true }) => {
      const W = 520, H = 430, L = 56, B = 42, T = 14, R = 14;
      const sx = (v) => L + ((v - 1) / 7) * (W - L - R);
      const sy = (v) => H - B - ((v - 1) / 7) * (H - B - T);
      const ticks = [1, 2, 3, 4, 5, 6, 7, 8];
      const lineCol = '#dc2626';
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full max-w-xl mx-auto bg-white rounded-lg border border-gray-200">
          {ticks.map(t => (
            <g key={t}>
              <line x1={sx(t)} y1={T} x2={sx(t)} y2={H - B} stroke="#eef2ff" />
              <line x1={L} y1={sy(t)} x2={W - R} y2={sy(t)} stroke="#eef2ff" />
              <text x={sx(t)} y={H - B + 18} textAnchor="middle" fontSize="13" fill="#4b5563">{t}</text>
              <text x={L - 8} y={sy(t) + 4} textAnchor="end" fontSize="13" fill="#4b5563">{t}</text>
            </g>
          ))}
          <line x1={L} y1={H - B} x2={W - R} y2={H - B} stroke="#374151" strokeWidth="1.5" />
          <line x1={L} y1={T} x2={L} y2={H - B} stroke="#374151" strokeWidth="1.5" />
          <text x={(L + W - R) / 2} y={H - 8} textAnchor="middle" fontSize="14" fontWeight="700" fill="#374151">매운 정도</text>
          <text x="16" y={(T + H - B) / 2} textAnchor="middle" fontSize="14" fontWeight="700" fill="#374151" transform={`rotate(-90 16 ${(T + H - B) / 2})`}>물의 양</text>

          {/* 트리가 나누는 기준선 */}
          {showLines && <line x1={L} y1={sy(3.8)} x2={W - R} y2={sy(3.8)} stroke={lineCol} strokeWidth="2" strokeDasharray="6 4" />}
          {showLines && (group === 2
            ? <line x1={sx(3.8)} y1={T} x2={sx(3.8)} y2={sy(3.8)} stroke={lineCol} strokeWidth="2" strokeDasharray="6 4" />
            : <line x1={sx(5.5)} y1={sy(3.8)} x2={sx(5.5)} y2={H - B} stroke={lineCol} strokeWidth="2" strokeDasharray="6 4" />)}

          {PTS_JJAJANG.map(([x, y], i) => <circle key={'a' + i} cx={sx(x)} cy={sy(y)} r="7" fill="#7dd3fc" stroke="#0284c7" opacity="0.85" />)}
          {PTS_JJAMPPONG.map(([x, y], i) => <circle key={'b' + i} cx={sx(x)} cy={sy(y)} r="7" fill="#fca5a5" stroke="#dc2626" opacity="0.85" />)}
          {group === 3 && PTS_JJOLMYEON.map(([x, y], i) => <circle key={'c' + i} cx={sx(x)} cy={sy(y)} r="7" fill="#bef264" stroke="#65a30d" opacity="0.9" />)}

          {showTest && TEST_ROWS.map(r => (
            <g key={r.n}>
              <rect x={sx(r.x) - 9} y={sy(r.y) - 9} width="18" height="18" fill="none" stroke="#16a34a" strokeWidth="3" />
              <circle cx={sx(r.x) + 14} cy={sy(r.y) - 14} r="10" fill="#dc2626" />
              <text x={sx(r.x) + 14} y={sy(r.y) - 10} textAnchor="middle" fontSize="12" fontWeight="700" fill="#fff">{r.n}</text>
            </g>
          ))}
          {probe && (
            <g>
              <circle cx={sx(probe.x)} cy={sy(probe.y)} r="11" fill="#fde047" stroke="#a16207" strokeWidth="3" />
              <text x={sx(probe.x)} y={sy(probe.y) + 5} textAnchor="middle" fontSize="14" fontWeight="700" fill="#713f12">?</text>
            </g>
          )}
        </svg>
      );
    };

    const ScatterLegend = ({ group, showLines = true }) => (
      <div className="flex flex-wrap justify-center gap-4 mt-2 text-base text-gray-700">
        <span className="flex items-center gap-1"><Dot c="bg-sky-300 border-sky-600" /> 짜장</span>
        <span className="flex items-center gap-1"><Dot c="bg-red-300 border-red-600" /> 짬뽕</span>
        {group === 3 && <span className="flex items-center gap-1"><Dot c="bg-lime-300 border-lime-600" /> 쫄면</span>}
        {showLines && <span className="flex items-center gap-1"><span className="inline-block w-6 border-t-2 border-dashed border-red-600"></span> 트리가 나눈 기준선</span>}
      </div>
    );

    const OrangeFlow = () => {
      const W = ({ x, y, label, fill, dashed }) => (
        <g>
          <circle cx={x} cy={y} r="26" fill={fill} stroke={dashed ? '#9ca3af' : '#6b7280'} strokeWidth="2.5" strokeDasharray={dashed ? '5 3' : '0'} />
          <text x={x} y={y + 47} textAnchor="middle" fontSize="14" fontWeight="700" fill={dashed ? '#6b7280' : '#1f2937'}>{label}</text>

      );
      const ln = (x1, y1, x2, y2, dashed) => <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={dashed ? '#cbd5e1' : '#94a3b8'} strokeWidth="2.5" strokeDasharray={dashed ? '5 3' : '0'} />;
      return (
        <svg viewBox="0 0 760 385" className="w-full min-w-[560px] max-w-3xl mx-auto">
          {ln(96, 180, 244, 45)}{ln(96, 180, 244, 135, true)}{ln(96, 180, 244, 225, true)}{ln(96, 180, 244, 315)}
          {ln(296, 315, 454, 315)}{ln(296, 315, 626, 198)}
          {ln(296, 135, 626, 168, true)}{ln(296, 225, 626, 186, true)}
          {ln(496, 45, 634, 156)}
          <W x={70} y={180} label="File (훈련)" fill="#fed7aa" />
          <W x={270} y={45} label="Scatter Plot" fill="#fecdd3" />
          <W x={270} y={135} label="kNN" fill="#fbcfe8" dashed />
          <W x={270} y={225} label="SVM" fill="#fbcfe8" dashed />
          <W x={270} y={315} label="Tree" fill="#fbcfe8" />
          <W x={480} y={315} label="Tree Viewer" fill="#fecdd3" />
          <W x={470} y={45} label="File (테스트)" fill="#fed7aa" />
          <W x={650} y={180} label="Predictions" fill="#a5f3fc" />
        </svg>
      );
    };

    const StepBlock = ({ title, children }) => (
      <div className="bg-white rounded-lg border border-gray-200 p-4">
        <p className="font-bold text-gray-800 mb-2">{title}</p>
        {children}
      </div>
    );
    const NumList = ({ items }) => (
      <ol className="space-y-2">
        {items.map((t, i) => (
          <li key={i} className="flex gap-2 text-base text-gray-700">
            <span className="flex-shrink-0 w-6 h-6 rounded-full bg-red-500 text-white text-sm font-bold flex items-center justify-center">{i + 1}</span>
            <span className="leading-relaxed">{t}</span>
          </li>

      </ol>

    const CsvTable = ({ rows, head }) => (
      <table className="text-base border-collapse">
        <thead><tr className="bg-gray-100">{head.map(h => <th key={h} className="border border-gray-300 px-3 py-1">{h}</th>)}</tr></thead>
        <tbody>{rows.map((r, i) => <tr key={i}>{r.map((c, j) => <td key={j} className="border border-gray-300 px-3 py-1 text-center">{c}</td>)}</tr>)}</tbody>
      </table>
    );

    const ProbeCalculator = ({ group }) => {
      const [x, setX] = useState(4.5);
      const [y, setY] = useState(4.5);
      const r = treeSteps(group, x, y);
      return (
        <div className="grid md:grid-cols-2 gap-5">
          <div>
            <ScatterPlot group={group} showTest={true} probe={{ x, y }} />
            <ScatterLegend group={group} />
            <p className="text-sm text-gray-500 text-center mt-1">초록 네모 ①~④가 테스트 데이터예요. 노란 ?는 아래 슬라이더로 움직이는 내 데이터예요.</p>
          </div>
          <div className="space-y-4">
            <div className="bg-yellow-50 border border-yellow-300 rounded-lg p-4">

              <label className="text-base text-gray-700 block">매운 정도: <b>{x.toFixed(1)}</b></label>
              <input type="range" min="1" max="8" step="0.1" value={x} onChange={(e) => setX(parseFloat(e.target.value))} className="w-full mb-2" />
              <label className="text-base text-gray-700 block">물의 양: <b>{y.toFixed(1)}</b></label>
              <input type="range" min="1" max="8" step="0.1" value={y} onChange={(e) => setY(parseFloat(e.target.value))} className="w-full" />
            </div>
            <div className={`rounded-lg border-2 p-4 ${leafTone(r.result)}`}>
              <p className="font-bold mb-1">🌳 트리가 걸어간 길</p>
              {r.steps.map((s, i) => <p key={i} className="text-base">{i + 1}단계: {s}</p>)}
              <p className="text-2xl font-bold mt-2">👉 예측: {r.result}</p>
            </div>
          </div>
        </div>
      );
    };

    const PredictionsTable = ({ group }) => {
      const pred = ORANGE_PRED[group];
      const correct = TEST_ROWS.filter((r, i) => pred.tree[i] === r.truth).length;
      const acc = Math.round((correct / TEST_ROWS.length) * 100);
      const cell = (v, truth) => <td className={`border border-gray-300 px-3 py-2 text-center font-bold ${v === truth ? 'text-green-700' : 'text-red-600'}`}>{v}</td>;
      return (
        <div>
          <div className="overflow-x-auto">
            <table className="w-full text-base border-collapse min-w-[520px]">
              <thead>
                <tr className="bg-cyan-50 text-cyan-900">
                  {['번호', '매운 정도', '물의 양', '진짜 종류(정답)', 'kNN', 'SVM', 'Tree', 'Tree 채점'].map(h => <th key={h} className="border border-cyan-200 px-3 py-2">{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {TEST_ROWS.map((r, i) => (
                  <tr key={r.n} className="odd:bg-white even:bg-gray-50">
                    <td className="border border-gray-300 px-3 py-2 text-center font-bold">{r.n}</td>
                    <td className="border border-gray-300 px-3 py-2 text-center">{r.x.toFixed(1)}</td>
                    <td className="border border-gray-300 px-3 py-2 text-center">{r.y.toFixed(1)}</td>
                    <td className="border border-gray-300 px-3 py-2 text-center bg-gray-200 font-bold">{r.truth}</td>
                    {cell(pred.knn[i], r.truth)}{cell(pred.svm[i], r.truth)}{cell(pred.tree[i], r.truth)}
                    <td className="border border-gray-300 px-3 py-2 text-center text-xl">{pred.tree[i] === r.truth ? '⭕' : '❌'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="mt-3 flex items-center gap-3">
            <div className="flex-1 h-4 bg-gray-200 rounded-full overflow-hidden"><div className="h-4 bg-gradient-to-r from-indigo-500 to-violet-500" style={{ width: `${acc}%` }}></div></div>
            <p className="font-bold text-indigo-800 text-base whitespace-nowrap">Tree 정확도 {correct}/{TEST_ROWS.length} = {acc}%</p>
          </div>
          <p className="text-base text-gray-600 mt-2">
            {group === 2
              ? '1번 (4.5, 4.5)은 진짜 짜장인데 트리가 짬뽕이라고 예측해서 틀렸어요. 이렇게 새 데이터로 시험해 봐야 모델이 얼마나 잘 맞히는지 알 수 있어요.'
              : '1번은 짬뽕으로 잘못 예측했고, 4번 (7.0, 1.0)은 훈련 데이터에 없던 위치라 쫄면이라고 예측해서 틀렸어요. 새로운 데이터가 훈련 데이터와 다르면 틀리기도 해요.'}
          </p>
        </div>
      );
    };

    const ORANGE_STEPS = [
      { id: 1, tab: 'Data 탭', title: 'File 위젯으로 훈련 데이터 불러오기' },
      { id: 2, tab: 'Visualize 탭', title: 'Scatter Plot으로 데이터 살펴보기' },
      { id: 3, tab: 'Model 탭', title: 'Tree 위젯 옵션 정하기' },
      { id: 4, tab: 'Visualize 탭', title: 'Tree Viewer로 트리 보기' },
      { id: 5, tab: 'Data 탭', title: '테스트 데이터 만들어 불러오기' },
      { id: 6, tab: 'Evaluate 탭', title: 'Predictions로 예측 확인하기' },
    ];
    const TAB_COLOR = { 'Data 탭': 'bg-orange-100 text-orange-800 border-orange-300', 'Visualize 탭': 'bg-rose-100 text-rose-800 border-rose-300', 'Model 탭': 'bg-pink-100 text-pink-800 border-pink-300', 'Evaluate 탭': 'bg-cyan-100 text-cyan-800 border-cyan-300' };

    /* 실습 파일: 구글 드라이브 공유 링크 (수업 자료 PPT에 걸려 있던 링크와 동일) */
    const driveUrl = (id) => `https://drive.google.com/file/d/${id}/view?usp=sharing`;
    const FILES = {
      train2:   { name: '이진분류훈련.csv',   id: '1B58GeztFHJ6zds5xY9yiCYxDEHSieger' },
      train3:   { name: '다중분류훈련.csv',   id: '1f3M-EMEVTmhZ6o1CLsqE-Xyqrwk2g3Bp' },
      test:     { name: '분류테스트.csv',     id: '1pNPOXpcVPZ7efAosR23IuNzNLLqaKzfL' },
      svm2:     { name: 'SVM.ows',            id: '1KZXhb0d8dcQRzc1JODpIDAzlgkBa-kgc' },
      svm3:     { name: 'SVM1.ows',           id: '1472b_b7mT1ZOmVfYGgQ5zqCXdMG5OK46' },
      tree2:    { name: '의사결정트리.ows',   id: '17Ihh7Llhl0dCB8HIjgFF7xR4QzLGtnMp' },
      tree3:    { name: '의사결정트리1.ows',  id: '1pFoyU7QRk2wdhK1awrRIzra8z8v9E0w-' },
    };
    const FileLink = ({ file, note }) => (
      <a href={driveUrl(file.id)} target="_blank" rel="noopener noreferrer"
        className="inline-flex items-center gap-2 bg-white border-2 border-indigo-300 text-indigo-700 px-4 py-2 rounded-lg font-bold text-base hover:bg-indigo-50 transition-all shadow-sm">
        <span>📥 {file.name}</span>{note && <span className="font-normal text-sm text-gray-500">{note}</span>}
      </a>
    );

    const OrangeTab = () => {
      const [group, setGroup] = useState(2);
      const [step, setStep] = useState(1);
      const cur = ORANGE_STEPS.find(s => s.id === step);
      const trainKey = group === 2 ? 'train2' : 'train3';
      const trainFile = FILES[trainKey].name;
      const count = group === 2 ? 30 : 42;
      const opt = group === 2 ? [['Induce binary tree', '체크'], ['Min. number of instances in leaves', '2'], ['Do not split subsets smaller than', '5'], ['Limit the maximal tree depth to', '10'], ['Stop when majority reaches [%]', '95']]
                              : [['Induce binary tree', '체크'], ['Min. number of instances in leaves', '3'], ['Do not split subsets smaller than', '10'], ['Limit the maximal tree depth to', '12'], ['Stop when majority reaches [%]', '90']];

      return (
        <div className="slide-in space-y-5">
          <Tip>Orange 프로그램에서 실제로 트리를 만들어 보는 순서예요. 단계 버튼을 눌러 화면 설명을 따라가 보세요. 그룹 수(2그룹/3그룹)에 따라 결과가 어떻게 달라지는지도 비교해 봐요.</Tip>

          <div className="bg-white border-2 border-indigo-200 rounded-xl p-5">
            <h3 className="text-lg font-bold text-indigo-900 mb-3">🗺️ 전체 흐름 (위젯 연결)</h3>
            <div className="overflow-x-auto"><OrangeFlow /></div>
            <div className="flex flex-wrap justify-center gap-2 mt-2 text-sm font-bold">
              {Object.keys(TAB_COLOR).map(k => <span key={k} className={`px-3 py-1 rounded-full border ${TAB_COLOR[k]}`}>{k}</span>)}
              <span className="px-3 py-1 rounded-full border border-gray-300 text-gray-500 bg-gray-50">점선 = 앞에서 배운 모델(비교용)</span>
            </div>
          </div>

          <div className="flex flex-wrap items-center gap-3 bg-gray-50 border border-gray-200 rounded-lg p-3">
            <span className="font-bold text-gray-700">분류할 그룹 수</span>
            {[2, 3].map(g => (
              <button key={g} onClick={() => setGroup(g)}
                className={`px-4 py-2 rounded-lg font-bold text-base border-2 transition-all ${group === g ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white border-transparent shadow-md' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-100'}`}>
                {g === 2 ? '2그룹 (짜장 · 짬뽕)' : '3그룹 (짜장 · 짬뽕 · 쫄면)'}
              </button>
            ))}
          </div>

          <div className="flex gap-2 overflow-x-auto pb-1">
            {ORANGE_STEPS.map(s => (
              <button key={s.id} onClick={() => setStep(s.id)}
                className={`flex-shrink-0 px-4 py-2 rounded-lg font-bold text-base whitespace-nowrap border-2 transition-all ${step === s.id ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-gray-600 border-gray-200 hover:bg-indigo-50'}`}>
                {s.id}단계
              </button>
            ))}
          </div>

          <div className="bg-gradient-to-r from-indigo-50 to-violet-50 border-2 border-indigo-200 rounded-xl p-5 slide-in" key={step + '-' + group}>
            <div className="flex flex-wrap items-center gap-2 mb-4">
              <span className={`px-3 py-1 rounded-full border font-bold text-sm ${TAB_COLOR[cur.tab]}`}>{cur.tab}</span>
              <h3 className="text-lg font-bold text-indigo-900">{cur.id}단계. {cur.title}</h3>
            </div>

            {step === 1 && (
              <div className="grid md:grid-cols-2 gap-4">
                <StepBlock title="📂 File 위젯 사용법">
                  <NumList items={[
                    <span>폴더 버튼을 눌러 <b>{trainFile}</b> 파일을 골라요.</span>,
                    <span>위쪽에 파일 이름이 잘 나오는지 확인해요.</span>,
                    <span><b>Role(역할)</b>을 정해요. 매운 정도·물의 양은 <b>feature</b>(재료), 종류는 <b>target</b>(맞혀야 할 정답)!</span>,
                    <span><b>Apply</b> 버튼을 눌러요.</span>,
                    <span>아래쪽 숫자 <b>{count}</b>가 보이면 데이터 {count}개를 잘 불러온 거예요.</span>,
                  ]} />
                  <p className="text-base text-green-700 font-bold mt-3">✅ 결측치(빈칸), 이상치(엉뚱한 값) 없음</p>
                  <div className="mt-3"><FileLink file={FILES[trainKey]} note={`(데이터 ${count}개)`} /></div>
                </StepBlock>
                <StepBlock title="📋 데이터 살펴보기 (앞부분)">
                  <CsvTable head={['', '종류', '매운 정도', '물의 양']} rows={[[1, '짜장', '4.5', '1.2'], [2, '짜장', '1.5', '1.8'], [3, '짜장', '1.8', '1.3'], [4, '짜장', '2.1', '2.0'], [10, '짬뽕', '5.2', '5.5'], [11, '짬뽕', '5.8', '5.3']]} />
                  <p className="text-base text-gray-600 mt-3">feature = 문제를 풀 때 쓰는 <b>재료</b>, target = 컴퓨터가 맞혀야 하는 <b>정답</b>이라고 기억하면 쉬워요.</p>
                </StepBlock>
              </div>
            )}

            {step === 2 && (
              <div className="grid md:grid-cols-2 gap-4 items-start">
                <div>
                  <ScatterPlot group={group} showTest={false} showLines={false} />
                  <ScatterLegend group={group} showLines={false} />
                </div>
                <StepBlock title="📊 Scatter Plot 설정">
                  <NumList items={[
                    <span>Axis x(가로)는 <b>매운 정도</b>, Axis y(세로)는 <b>물의 양</b>으로 골라요.</span>,
                    <span>Color(색)는 <b>종류</b>로 골라요.</span>,
                  ]} />
                  <p className="text-base text-gray-700 mt-3 leading-relaxed">👀 점들이 어느 위치에 모여 있는지 확인해요. {group === 2
                    ? '짜장(파랑)은 왼쪽 아래, 짬뽕(빨강)은 위쪽에 모여 있죠?'
                    : '짜장(파랑)은 왼쪽 아래, 짬뽕(빨강)은 위쪽, 쫄면(초록)은 오른쪽 아래에 모여 있어요.'}</p>
                </StepBlock>
              </div>
            )}

            {step === 3 && (
              <div className="grid md:grid-cols-2 gap-4">
                <StepBlock title={`⚙️ ${group}그룹으로 분류할 때 Tree 옵션`}>
                  <table className="w-full text-base border-collapse">
                    <tbody>
                      {opt.map(([n, v]) => (
                        <tr key={n}><td className="border border-gray-300 px-2 py-1 text-gray-700">{n}</td><td className="border border-gray-300 px-2 py-1 text-center font-bold text-indigo-700 w-20">{v}</td></tr>
                      ))}
                    </tbody>
                  </table>
                </StepBlock>
                <StepBlock title="🌳 Tree 위젯이 하는 일">
                  <p className="text-base text-gray-700 leading-relaxed">데이터를 <b>질문으로 나누며 정답을 찾아가는</b> 위젯이에요. 앞 탭에서 배운 옵션 5개를 여기에서 정해요.</p>
                  <p className="text-base text-gray-700 leading-relaxed mt-2">{group === 2
                    ? '그룹이 2개이고 데이터가 30개로 적은 편이라 기본값에 가까운 옵션을 써요.'
                    : '그룹이 3개이고 데이터가 42개로 늘었으니, 잎 최소 개수와 깊이를 조금 더 크게 잡았어요.'}</p>
                </StepBlock>
              </div>
            )}

            {step === 4 && (
              <div className="grid md:grid-cols-2 gap-4">
                <StepBlock title="🌲 Tree Viewer가 보여 준 트리">
                  <div className="overflow-x-auto"><div className="min-w-[380px] flex justify-center py-2"><MiniTree node={group === 2 ? TREE_2 : TREE_3} /></div></div>
                  <p className="text-sm text-gray-500 mt-1">잎 안의 숫자: 그 칸에 모인 데이터 중 맞는 정답의 비율(맞은 개수/전체 개수)</p>
                </StepBlock>
                <StepBlock title="🔍 트리 읽어 보기">
                  <p className="text-base text-gray-700 leading-relaxed">Tree Viewer 위젯은 만들어진 트리를 <b>그림으로</b> 보여 줘요. (5 nodes, 3 leaves = 노드 5개, 잎 3개)</p>
                  <p className="text-base text-gray-700 leading-relaxed mt-2">컴퓨터는 <b>가장 잘 나누는 속성으로 "물의 양"</b>을 첫 질문으로 골랐어요.</p>
                  <p className="text-base text-gray-700 leading-relaxed mt-2">{group === 2
                    ? '물의 양이 적으면 모두 짜장! 많은 쪽에서는 매운 정도를 한 번 더 물어보고 짬뽕을 찾아요.'
                    : '물의 양이 많으면 짬뽕! 적은 쪽에서는 매운 정도를 물어서 짜장과 쫄면을 나눠요.'}</p>
                </StepBlock>
              </div>
            )}

            {step === 5 && (
              <div className="grid md:grid-cols-2 gap-4">
                <StepBlock title="📝 엑셀에서 CSV 파일 만들기">
                  <NumList items={[
                    <span>엑셀에 테스트 데이터 4줄을 입력해요.</span>,
                    <span>[다른 이름으로 저장]에서 저장할 위치를 골라요.</span>,
                    <span>파일 이름을 <b>분류테스트</b>로 써요.</span>,
                    <span>파일 형식은 반드시 <b>CSV UTF-8 (쉼표로 분리)(*.csv)</b>로 골라요.</span>,
                  ]} />
                  <p className="text-base text-orange-700 font-bold mt-3">💡 CSV UTF-8로 저장해야 한글이 깨지지 않고 유지돼요!</p>
                </StepBlock>
                <StepBlock title="📋 분류테스트.csv 내용">
                  <CsvTable head={['매운 정도', '물의 양', '종류']} rows={TEST_ROWS.map(r => [r.x.toFixed(1), r.y.toFixed(1), r.truth])} />
                  <p className="text-base text-gray-600 mt-3">이 4개는 훈련에 쓰지 않은 <b>새 데이터</b>예요. File 위젯을 하나 더 놓고 이 파일을 불러와 "테스트"라고 이름 붙여요. (Role은 훈련 때와 똑같이!)</p>
                  <div className="mt-3"><FileLink file={FILES.test} note="(테스트 데이터 4개)" /></div>
                </StepBlock>
              </div>
            )}

            {step === 6 && (
              <div className="space-y-4">
                <StepBlock title="🔮 kNN · SVM · Tree가 예측한 결과">
                  <PredictionsTable group={group} />
                </StepBlock>
                <StepBlock title="🧪 내가 직접 새 데이터를 넣어 볼까요?">
                  <ProbeCalculator group={group} />
                </StepBlock>
              </div>
            )}

            <div className="flex justify-between mt-5">
              <button onClick={() => setStep(Math.max(1, step - 1))} disabled={step === 1}
                className="px-4 py-2 rounded-lg border border-gray-300 bg-white text-gray-600 font-bold text-base disabled:opacity-40">◀ 이전 단계</button>
              <button onClick={() => setStep(Math.min(ORANGE_STEPS.length, step + 1))} disabled={step === ORANGE_STEPS.length}
                className="px-4 py-2 rounded-lg bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold text-base disabled:opacity-40">다음 단계 ▶</button>
            </div>
          </div>

          <div className="bg-blue-50 border-2 border-blue-200 rounded-xl p-5">
            <p className="font-bold text-blue-900 mb-1">📎 실습 파일 내려받기</p>
            <p className="text-base text-gray-600 mb-3">버튼을 누르면 구글 드라이브가 새 창으로 열려요. 화면 위쪽의 <b>다운로드(⬇)</b> 버튼을 눌러 저장한 뒤, Orange의 File 위젯에서 불러와요.</p>
            <p className="text-sm font-bold text-blue-800 mb-2">데이터 파일 (CSV)</p>
            <div className="flex flex-wrap gap-3 mb-4">
              <FileLink file={FILES.train2} note="(2그룹 · 30개)" />
              <FileLink file={FILES.train3} note="(3그룹 · 42개)" />
              <FileLink file={FILES.test} note="(테스트 4개)" />
            </div>
            <p className="text-sm font-bold text-blue-800 mb-2">Orange 작업 파일 (.ows)</p>
            <div className="flex flex-wrap gap-3">
              <FileLink file={FILES.svm2} note="(2그룹)" />
              <FileLink file={FILES.tree2} note="(2그룹)" />
              <FileLink file={FILES.svm3} note="(3그룹)" />
              <FileLink file={FILES.tree3} note="(3그룹)" />
            </div>
          </div>
        </div>
      );
    };

    /* ═════════════ 탭6: 장점과 단점 ═════════════ */
    const OverfitChart = () => {
      const W = 520, H = 300, L = 50, B = 46, T = 20, R = 20;
      const train = [70, 82, 90, 95, 98, 100, 100, 100];
      const test = [68, 80, 86, 87, 84, 80, 76, 72];
      const sx = (i) => L + (i / 7) * (W - L - R);
      const sy = (v) => H - B - ((v - 60) / 45) * (H - B - T);
      const pts = (arr) => arr.map((v, i) => `${sx(i)},${sy(v)}`).join(' ');
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full max-w-lg mx-auto bg-white rounded-lg border border-gray-200">
          {[60, 70, 80, 90, 100].map(v => (
            <g key={v}>
              <line x1={L} y1={sy(v)} x2={W - R} y2={sy(v)} stroke="#eef2ff" />
              <text x={L - 8} y={sy(v) + 4} textAnchor="end" fontSize="12" fill="#4b5563">{v}%</text>
            </g>
          ))}
          {train.map((_, i) => <text key={i} x={sx(i)} y={H - B + 18} textAnchor="middle" fontSize="12" fill="#4b5563">{i + 1}</text>)}
          <line x1={L} y1={H - B} x2={W - R} y2={H - B} stroke="#374151" />
          <text x={(L + W - R) / 2} y={H - 8} textAnchor="middle" fontSize="13" fontWeight="700" fill="#374151">트리의 깊이 (질문을 이어가는 단계)</text>
          <rect x={sx(3) - 22} y={T} width="44" height={H - B - T} fill="#bbf7d0" opacity="0.5" />
          <text x={sx(3)} y={T + 14} textAnchor="middle" fontSize="12" fontWeight="700" fill="#166534">알맞은 깊이</text>
          <polyline points={pts(train)} fill="none" stroke="#2563eb" strokeWidth="3" />
          <polyline points={pts(test)} fill="none" stroke="#dc2626" strokeWidth="3" />
          {train.map((v, i) => <circle key={'t' + i} cx={sx(i)} cy={sy(v)} r="4" fill="#2563eb" />)}
          {test.map((v, i) => <circle key={'s' + i} cx={sx(i)} cy={sy(v)} r="4" fill="#dc2626" />)}
          <text x={sx(5) + 6} y={sy(100) - 8} fontSize="13" fontWeight="700" fill="#2563eb">지금 가진 데이터</text>
          <text x={sx(4) + 24} y={sy(70)} fontSize="13" fontWeight="700" fill="#dc2626">새로운 데이터</text>
        </svg>
      );
    };

    const ProsConsTab = () => (
      <div className="slide-in space-y-6">
        <Tip>의사결정 트리가 왜 인기가 많은지, 그리고 조심할 점은 무엇인지 정리해 봐요.</Tip>

        <div className="grid md:grid-cols-2 gap-5">
          <div className="bg-green-50 border-2 border-green-300 rounded-xl p-5">
            <h3 className="text-lg font-bold text-green-800 mb-3">👍 장점</h3>
            <div className="space-y-3 text-base text-gray-700 leading-relaxed">
              <div className="bg-white rounded-lg p-3 shadow-sm"><p className="font-bold text-green-700">이해하기 쉬워요</p><p>트리 그림만 보면 누구나 왜 그런 분류 결과가 나왔는지 바로 알 수 있어요.</p></div>
              <div className="bg-white rounded-lg p-3 shadow-sm"><p className="font-bold text-green-700">복잡한 수식 계산이 없어요</p><p>복잡한 계산식 없이 조건을 비교하기만 해요.</p></div>
              <div className="bg-white rounded-lg p-3 shadow-sm"><p className="font-bold text-green-700">규칙이 명확해요</p><p>선택 규칙이 'If-Then(만약 ~라면 ~이다)' 문장으로 분명하게 나와요.</p></div>
            </div>
          </div>
          <div className="bg-red-50 border-2 border-red-300 rounded-xl p-5">
            <h3 className="text-lg font-bold text-red-800 mb-3">⚠️ 단점</h3>
            <div className="space-y-3 text-base text-gray-700 leading-relaxed">
              <div className="bg-white rounded-lg p-3 shadow-sm"><p className="font-bold text-red-700">과대적합(Overfitting) 위험</p><p>질문을 너무 많이 만들어 트리가 지나치게 복잡해지면, 새로운 실제 데이터에서는 예측 성능이 떨어져요.</p></div>
              <div className="bg-white rounded-lg p-3 shadow-sm"><p className="font-bold text-red-700">데이터 변화에 민감해요</p><p>데이터가 아주 조금만 바뀌어도 전체 트리 구조가 완전히 달라질 수 있어요.</p></div>
              <div className="bg-white rounded-lg p-3 shadow-sm"><p className="font-bold text-blue-700">🛠️ 해결책</p><p>트리의 <b>깊이(Depth)를 제한</b>하고 <b>최소 데이터 개수</b> 옵션을 조절해서 과대적합을 막아요!</p></div>
            </div>
          </div>
        </div>

        <div className="bg-white border-2 border-indigo-200 rounded-xl p-5">
          <h3 className="text-lg font-bold text-indigo-900 mb-1">📉 과대적합, 그림으로 이해하기</h3>
          <p className="text-base text-gray-600 mb-3">시험 문제를 통째로 외우면 외운 문제는 100점이지만, 새로운 문제는 잘 못 풀죠? 트리도 똑같아요. 질문을 너무 많이 만들면 지금 가진 데이터는 잘 맞히지만 새로운 데이터는 점점 틀려요.</p>
          <OverfitChart />
          <p className="text-sm text-gray-500 text-center mt-2">※ 이해를 돕기 위한 개념 그림이에요. 실제 측정값이 아니에요.</p>
        </div>

        <div className="bg-white border-2 border-purple-200 rounded-xl p-5">
          <h3 className="text-lg font-bold text-purple-900 mb-1">🧾 트리는 If-Then 규칙으로 바꿀 수 있어요</h3>
          <p className="text-base text-gray-600 mb-3">앞에서 본 트리를 문장으로 바꿔 쓰면 이렇게 돼요. 위에서부터 차례대로 확인하고, 처음으로 맞는 규칙을 따라요.</p>
          <div className="grid md:grid-cols-2 gap-4">
            <div className="bg-gray-900 text-green-300 rounded-lg p-4 text-base leading-loose">
              <p className="text-gray-400 text-sm mb-1">생존 예측 트리</p>
              <p>만약 성별이 여성이면 → <b>생존</b></p>
              <p>아니라면, 나이가 9.5보다 많으면 → <b>사망</b></p>
              <p>아니라면, 동반가족이 2.5보다 많으면 → <b>사망</b></p>
              <p>그 외에는 → <b>생존</b></p>
            </div>
            <div className="bg-gray-900 text-green-300 rounded-lg p-4 text-base leading-loose">
              <p className="text-gray-400 text-sm mb-1">짜장 · 짬뽕 · 쫄면 트리</p>
              <p>만약 물의 양이 3.8보다 많으면 → <b>짬뽕</b></p>
              <p>아니라면, 매운 정도가 5.5 이하이면 → <b>짜장</b></p>
              <p>그 외에는 → <b>쫄면</b></p>
            </div>
          </div>
        </div>
      </div>
    );

    /* ═════════════ 탭7: 퀴즈 ═════════════ */
    const quizData = [
      { id: 1, q: '스무고개처럼 질문을 던지며 답을 찾아가는 과정을 나무 모양으로 만든 것은 무엇일까요?',
        opts: ['의사결정 트리', '산점도', '막대그래프', '엑셀 표'], ans: 0,
        expl: '질문(조건)에 "예/아니오"로 답하며 결과에 도착하는 모양이 나무를 거꾸로 뒤집은 것 같아서 의사결정 트리라고 불러요.' },
      { id: 2, q: '의사결정 트리에서 가장 먼저 질문을 던지는 시작 부분과, 마지막에 결과가 있는 끝 부분의 이름을 순서대로 고르세요.',
        opts: ['잎 → 뿌리', '뿌리 → 잎', '가지 → 열매', '줄기 → 뿌리'], ans: 1,
        expl: '시작은 뿌리, 끝은 잎이에요. 잎에는 더 이상 질문이 없고 결과(정답)가 들어 있어요.' },
      { id: 3, q: 'Orange의 Tree 위젯에서 "Induce binary tree"에 체크하면 어떻게 될까요?',
        opts: ['한 번에 두 그룹으로만 나뉘는 트리를 만든다', '한 번에 세 그룹 이상으로 나뉜다', '트리가 만들어지지 않는다', '데이터가 자동으로 지워진다'], ans: 0,
        expl: '체크하면 질문이 항상 "예/아니오" 두 갈래로만 나뉘어서 트리가 깔끔해지고 계산도 단순해져요.' },
      { id: 4, q: '트리가 너무 깊어져서 지금 가진 데이터만 외우고, 새로운 데이터는 잘 못 맞히는 문제를 무엇이라고 할까요?',
        opts: ['결측치', '과대적합(Overfitting)', '이상치', '데이터 수집'], ans: 1,
        expl: '시험 문제를 통째로 외운 것과 같아요. 트리의 깊이를 제한하거나 최소 데이터 개수를 늘려서 막을 수 있어요.' },
      { id: 5, q: '트리가 너무 복잡하게 만들어졌어요. 다음 중 알맞은 해결 방법은 무엇일까요?',
        opts: ['최대 깊이를 더 크게 늘린다', '최대 깊이를 줄인다', '데이터를 모두 지운다', '질문을 예/아니오 대신 여러 갈래로 만든다'], ans: 1,
        expl: '깊이를 줄이면 질문을 이어가는 단계가 제한돼서 트리가 단순해져요.' },
      { id: 6, q: '다음 중 의사결정 트리의 특징이 아닌 것은 무엇일까요?',
        opts: ['트리 그림만 보면 결과가 나온 이유를 알 수 있다', '복잡한 수식 없이 조건 비교만 한다', '선택 규칙이 If-Then 문장으로 나온다', '데이터가 바뀌어도 트리 구조는 절대 변하지 않는다'], ans: 3,
        expl: '의사결정 트리는 데이터가 조금만 바뀌어도 트리 구조가 크게 달라질 수 있어요. 그래서 데이터 변화에 민감하다는 단점이 있어요.' },
      { id: 7, q: 'Orange의 File 위젯에서 "종류"(짜장, 짬뽕처럼 컴퓨터가 맞혀야 할 정답) 열의 Role은 무엇으로 정해야 할까요?',
        opts: ['feature', 'target', 'skip', 'meta'], ans: 1,
        expl: '맞혀야 할 정답은 target, 정답을 맞히는 데 쓰는 재료(매운 정도, 물의 양)는 feature예요.' },
      { id: 8, q: '엑셀에서 한글이 들어 있는 데이터를 CSV로 저장할 때, 한글이 깨지지 않게 하는 파일 형식은 무엇일까요?',
        opts: ['텍스트(탭으로 분리)', 'CSV UTF-8 (쉼표로 분리)', 'PDF', '웹 페이지'], ans: 1,
        expl: 'CSV UTF-8 형식으로 저장하면 한글이 포함된 데이터가 손상되지 않고 그대로 유지돼요.' },
    ];

    const QuizTab = () => {
      const [quizAnswers, setQuizAnswers] = useState({});
      const [shakeId, setShakeId] = useState(null);
      const handleQuiz = (qid, idx) => {
        if (quizAnswers[qid] !== undefined) return;
        const q = quizData.find(q => q.id === qid);
        if (idx !== q.ans) { setShakeId(qid); setTimeout(() => setShakeId(null), 400); }
        setQuizAnswers(prev => ({ ...prev, [qid]: idx }));
      };
      const calcScore = () => quizData.filter(q => quizAnswers[q.id] === q.ans).length;
      const total = quizData.length;
      const score = calcScore();
      const ratio = score / total;
      return (
        <div className="slide-in space-y-5">
          <div className="bg-gradient-to-r from-indigo-50 to-violet-50 p-4 rounded-lg border border-indigo-200 flex items-center justify-between gap-3">
            <div>
              <p className="font-bold text-indigo-900">🎯 오늘 배운 내용을 확인해 봐요!</p>
              <p className="text-base text-gray-600">보기를 누르면 바로 정답을 알 수 있어요.</p>
            </div>
            {Object.keys(quizAnswers).length > 0 && (
              <button onClick={() => setQuizAnswers({})}
                className="bg-gradient-to-r from-indigo-600 to-violet-600 text-white px-4 py-2 rounded-lg font-bold text-base whitespace-nowrap">🔄 다시 풀기</button>
            )}
          </div>

          <div className="flex gap-2">
            {quizData.map(q => (
              <div key={q.id} className={`h-2 flex-1 rounded-full transition-all duration-500 ${
                quizAnswers[q.id] !== undefined ? (quizAnswers[q.id] === q.ans ? 'bg-green-500' : 'bg-red-400') : 'bg-gray-200'}`} />
            ))}
          </div>

          {quizData.map(q => {
            const answered = quizAnswers[q.id] !== undefined;
            return (
              <div key={q.id} className={`bg-white border-2 border-gray-200 rounded-xl p-5 shadow-sm ${shakeId === q.id ? 'shake' : ''}`}>
                <p className="text-base font-bold text-indigo-600 mb-2">Q{q.id} / {total}</p>
                <p className="text-base font-bold text-gray-800 mb-4">{q.q}</p>
                <div className="space-y-2 mb-3">
                  {q.opts.map((opt, idx) => {
                    let style = 'bg-gray-50 border-gray-200 text-gray-700 hover:bg-indigo-50 hover:border-indigo-300';
                    if (answered) {
                      if (idx === q.ans) style = 'bg-green-50 border-green-400 text-green-800 font-bold';
                      else if (idx === quizAnswers[q.id]) style = 'bg-red-50 border-red-400 text-red-700';
                      else style = 'bg-gray-50 border-gray-200 text-gray-400';
                    }
                    return (
                      <button key={idx} onClick={() => handleQuiz(q.id, idx)} disabled={answered}
                        className={`w-full text-left px-4 py-3 rounded-lg border-2 text-base transition-all ${style} ${answered ? 'cursor-default' : 'cursor-pointer'}`}>
                        <span className="font-bold mr-2">{['①', '②', '③', '④'][idx]}</span>{opt}
                        {answered && idx === q.ans && <span className="ml-2">✅</span>}
                        {answered && idx === quizAnswers[q.id] && idx !== q.ans && <span className="ml-2">❌</span>}
                      </button>
                    );
                  })}
                </div>
                {answered && (
                  <div className={`p-3 rounded-lg text-base leading-relaxed ${quizAnswers[q.id] === q.ans ? 'bg-green-50 border border-green-300 text-green-800' : 'bg-orange-50 border border-orange-300 text-orange-800'}`}>
                    {quizAnswers[q.id] === q.ans ? '🎉 정답이에요! ' : '💡 정답 설명: '}{q.expl}
                  </div>
                )}
              </div>
            );
          })}

          {Object.keys(quizAnswers).length === total && (
            <div className="slide-in bg-gradient-to-r from-indigo-50 to-violet-50 p-6 rounded-xl border-2 border-indigo-300 text-center">
              <div className="text-5xl mb-3">{ratio === 1 ? '🏆' : ratio >= 0.75 ? '🌟' : ratio >= 0.4 ? '👍' : '📚'}</div>
              <p className="text-2xl font-bold text-indigo-800 mb-2">{score} / {total} 점</p>
              <p className="text-base text-gray-600">
                {ratio === 1 ? '완벽해요! 의사결정 트리 마스터예요! 🏆'
                  : ratio >= 0.75 ? '잘했어요! 거의 다 맞혔네요 👍'
                  : ratio >= 0.4 ? '조금만 더 복습해 봐요! 💪'
                  : '다시 한번 처음부터 배워 봐요! 📖'}
              </p>
            </div>
          )}
        </div>
      );
    };

    /* ═════════════ 전체 화면 ═════════════ */
    const App = () => {
      const [activeTab, setActiveTab] = useState('intro');
      const [showGoal, setShowGoal] = useState(true);

      const tabs = [
        { id: 'intro',    label: '🎮 스무고개와 트리' },
        { id: 'example',  label: '🔮 트리로 예측하기' },
        { id: 'lab',      label: '🌳 트리 만들기 체험' },
        { id: 'options',  label: '⚙️ 옵션 5가지' },
        { id: 'orange',   label: '🧪 Orange 실습' },
        { id: 'proscons', label: '⚖️ 장점과 단점' },
        { id: 'quiz',     label: '🎯 퀴즈' },
      ];

      return (
        <div className="max-w-7xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">

          {/* 헤더 */}
          <div className="bg-gradient-to-r from-indigo-700 to-violet-700 p-6 text-white">
            <div className="flex justify-between items-center mb-2">
              <div className="text-base text-indigo-100 mb-2">고등학교 인공지능기초 학습자료</div>
              <a href="index.html"
                className="bg-white text-indigo-600 px-4 py-2 rounded-lg font-bold text-sm hover:bg-indigo-50 transition-all shadow-md hover:shadow-lg flex items-center gap-2">
                🏠 홈으로
              </a>
            </div>
            <h1 className="text-3xl font-bold mb-2">🌳 의사결정 트리 - 질문으로 정답을 찾아가는 AI</h1>
            <p className="text-indigo-100">스무고개처럼 질문을 던지며 데이터를 분류하는 방법을 직접 체험해 봐요!</p>
            <button onClick={() => setShowGoal(!showGoal)}
              className="w-full bg-white/10 hover:bg-white/15 rounded-lg p-4 mt-4 transition-colors text-left">
              <div className="flex items-center justify-between">
                <p className="font-bold">🎯 오늘 우리가 할 수 있게 될 것</p>
                <span className={`text-xl transition-transform duration-300 ${showGoal ? 'rotate-180' : ''}`}>⌄</span>
              </div>
              {showGoal && (
                <div className="slide-in mt-2 space-y-1">
                  <p className="text-indigo-50 text-base">🎮 스무고개처럼 질문으로 답을 찾아가는 과정이 의사결정 트리라는 것을 설명할 수 있어요.</p>
                  <p className="text-indigo-50 text-base">🌳 트리의 뿌리·노드·잎이 무엇인지 알고, 옵션이 트리 모양에 주는 영향을 설명할 수 있어요.</p>
                  <p className="text-indigo-50 text-base">🧪 Orange로 트리를 만들고, 새로운 데이터를 예측해 볼 수 있어요.</p>
                </div>
              )}
            </button>
          </div>

          {/* 탭 */}
          <div className="flex gap-2 p-4 bg-gray-50 border-b border-gray-200 overflow-x-auto">
            {tabs.map(t => (
              <button key={t.id} onClick={() => setActiveTab(t.id)}
                className={`px-5 py-2 rounded-lg font-bold text-base transition-all whitespace-nowrap ${
                  activeTab === t.id
                    ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md'
                    : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'}`}>
                {t.label}
              </button>
            ))}
          </div>

          <div className="p-6">
            {activeTab === 'intro'    && <IntroTab />}
            {activeTab === 'example'  && <ExampleTab />}
            {activeTab === 'lab'      && <LabTab />}
            {activeTab === 'options'  && <OptionsTab />}
            {activeTab === 'orange'   && <OrangeTab />}
            {activeTab === 'proscons' && <ProsConsTab />}
            {activeTab === 'quiz'     && <QuizTab />}
          </div>

          <div className="p-6 text-center border-t border-gray-100">
            <a href="index.html"
              className="inline-block bg-gradient-to-r from-indigo-700 to-violet-700 text-white w-64 py-3 rounded-lg font-bold text-lg hover:opacity-90 transition-all shadow-lg hover:shadow-xl">
              🏠 홈으로 돌아가기
            </a>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
