고 \"청소를 했다\" → 둘 다 해야 참",rows:[["p","q","p∧q"],["T","T","T"],["T","F","F"],["F","T","F"],["F","F","F"]]},{key:"OR",symbol:"p ∨ q",name:"논리합 (OR)",color:"sky",desc:"둘 중 하나라도 참이면 참이 돼요. 둘 다 거짓일 때만 거짓!",ex:"\"버스를 탄다\" 또는 \"지하철을 탄다\" → 하나만 해도 참",rows:[["p","q","p∨q"],["T","T","T"],["T","F","T"],["F","T","T"],["F","F","F"]]},{key:"IMP",symbol:"p → q",name:"함축 (조건, ~라면)",color:"violet",desc:"\"p이면 q이다\". p가 참인데 q가 거짓일 때만 거짓이 돼요.",ex:"\"비가 오면 우산을 쓴다\" → 비가 왔는데(p참) 우산을 안 쓰면(q거짓) 약속 위반!",rows:[["p","q","p→q"],["T","T","T"],["T","F","F"],["F","T","T"],["F","F","T"]]},{key:"BIC",symbol:"p ↔ q",name:"상호조건 (필요충분)",color:"teal",desc:"\"p이면 q, q이면 p\". 두 명제의 참·거짓이 같을 때만 참이에요.",ex:"\"세 각이 같다 ↔ 정삼각형이다\" → 서로 완전히 같은 조건",rows:[["p","q","p↔q"],["T","T","T"],["T","F","F"],["F","T","F"],["F","F","T"]]},{key:"CON",symbol:"~q → ~p",name:"대우 (Contrapositive)",color:"amber",desc:"p→q 가 참이면, 뒤집고 순서를 바꾼 \"~q→~p\"도 항상 참이에요! 추론의 핵심 무기!",ex:"\"비가 오면 땅이 젖는다\" → 대우: \"땅이 젖지 않으면 비가 오지 않았다\" (항상 참)",rows:[["원명제","대우"],["p → q","~q → ~p"],["참이면","항상 참!"]]}];const liarCases=[{id:1,title:"예제1 · 수영 선수를 찾아라",rule:"용의자는 5명(누리·단비·바다·슬기·한울). 말을 한 4명 중 진실은 오직 1명! 수영 선수도 5명 중 1명이다.",clue:"누리:\"나는 수영 선수이다.\"\n단비:\"슬기가 수영 선수이다.\"\n바다:\"한울이 수영 선수이다.\"\n슬기:\"단비의 말은 거짓말이다.\"\n한울: (아무 말도 하지 않음)",steps:["① 슬기와 단비는 완벽한 모순관계! 슬기가 \"단비는 거짓말한다\"고 했으니, 둘이 동시에 참일 수는 없어요 → 진실을 말한 1명은 반드시 단비 또는 슬기 중에 있어요.","② 그러므로 누리와 바다는 무조건 거짓말쟁이! → 누리(거짓): \"나는 수영 선수\"가 거짓이므로 누리는 수영 선수가 아니다. / 바다(거짓): \"한울이 수영 선수\"가 거짓이므로 한울도 수영 선수가 아니다.","③ 가정 A - 슬기가 진실이라면? → 슬기 말이 참이니 단비는 거짓 → 단비의 \"슬기가 수영 선수\"도 거짓이 되어 슬기도 수영 선수 탈락. 그런데 남은 단비·바다 중 누가 선수인지 정할 방법이 없어요 → 모순(정답을 하나로 정할 수 없음)!","④ 가정 B - 단비가 진실이라면? → 단비의 \"슬기가 수영 선수\"가 참이 되고, 슬기의 \"단비는 거짓말한다\"는 자동으로 거짓이 되어 앞뒤가 완벽하게 들어맞아요! 진실이 딱 1명(단비)이라는 조건도 만족!","⑤ 혹시 누리나 바다가 진실이라면? → 둘 중 누가 참이어도 \"단비는 거짓 → 슬기는 참\"이 자동으로 성립해버려 진실이 2명이 되어버려요 → 조건 위반! 그러므로 누리·바다는 확실히 거짓으로 확정."],answer:"정답: 진실을 말한 사람은 단비, 수영 선수는 슬기예요! 🏊 (핵심 전략: 서로 모순되는 두 사람을 찾으면, 진실은 반드시 그 둘 중 하나!)"},{id:2,title:"예제2 · 도둑을 찾아라",rule:"5명 중 1명만 거짓을 말하고 있다. 도둑은 1명이다. 거짓말을 하는 사람은?",clue:"A:\"D의 말은 거짓이다.\"\nB:\"A가 도둑이다.\"\nC:\"D의 말은 사실이다.\"\nD:\"B는 도둑이 아니다.\"\nE:\"D는 도둑이 아니다.\"",steps:["A와 C는 완벽한 모순관계! (D에 대해 정반대 주장)","거짓말쟁이가 1명뿐이므로 → 거짓말쟁이는 반드시 A 또는 C 중 하나","따라서 B, D, E의 말은 100% 참(진실)","C가 거짓이라 가정 → A가 참 → D도 거짓 → 거짓말쟁이 2명 (오류!)","A가 거짓이라 가정 → C 참, 거짓말쟁이는 A 딱 1명 (조건 만족!)"],answer:"결론: 거짓말쟁이는 A. 100% 참인 B가 \"A가 도둑\"이라 했으므로 → 도둑은 A!"},{id:3,title:"예제3 · 범인을 찾아라",rule:"5명 중 1명만 거짓을 말하고 있다. 범인은 1명이다. 범인은 누구인가?",clue:"A:\"E는 범인이 아니다.\"\nB:\"C 또는 E가 범인이다.\"\nC:\"A는 거짓말을 하지 않는다.\"\nD:\"B가 범인이다.\"\nE:\"A 또는 B가 범인이다.\"",steps:["B와 E는 대립관계 → 사실상 모순관계 (한 명은 무조건 거짓)","거짓말쟁이는 B 또는 E → 나머지 A, C, D는 100% 참","100% 정직한 D: \"B가 범인이다\" → 범인은 B","E가 거짓이라 가정 → 드모르간 ~(A∨B)≡~A∧~B → \"B는 범인 아님\", D와 충돌(오류!)","B가 거짓이라 가정 → ~(C∨E) → 모든 진술이 충돌 없이 성립!"],answer:"결론: 거짓말쟁이도 B, 진짜 범인도 B!"},{id:4,title:"예제4 · 범인 2명을 찾아라",rule:"5명 중 1명만 거짓을 말하고 있다. 범인은 2명이다. 거짓말을 한 사람은?",clue:"A:\"D가 범인이다.\"\nB:\"A 또는 C가 범인이다.\"\nC:\"B 또는 E 중에 1명이 범인이다.\"\nD:\"B와 C는 범인이 아니다.\"\nE:\"A는 거짓말을 한다.\"",steps:["A와 E는 모순관계 → 거짓말쟁이는 A 또는 E, 나머지 B·C·D는 100% 참","D(참): \"B와 C는 범인 아님\" → 범인 후보는 A, D, E","C(참): \"B 또는 E 1명이 범인\" → B가 아니므로 E는 범인!","B(참): \"A 또는 C가 범인\" → C가 아니므로 A는 범인!","E가 거짓 가정 → A참 → \"D가 범인\" → 범인 3명(초과 오류!) / A가 거짓 가정 → 완벽 성립"],answer:"결론: 거짓말쟁이는 A. 진짜 범인은 A와 E, 2명!"}];const chainCases=[{id:5,title:"예제5 · 먹거리 논리",color:"indigo",premisesText:["수수를 먹는 사람은 쌀을 먹는다.","감자를 먹지 않는 사람은 콩을 먹는다.","쌀을 먹는 사람은 고구마를 먹지 않는다.","콩을 먹지 않는 사람은 고구마를 먹는다."],premises:["수수 → 쌀","~감자 → 콩","쌀 → ~고구마","~콩 → 고구마"],chain:"수수 → 쌀 → ~고구마 → 콩",chainDual:"~콩 → 고구마 → ~쌀 → ~수수",options:[{t:"수수 → ~감자",orig:"① 수수를 먹는 사람은 감자를 먹지 않는다.",v:"알 수 없음"},{t:"~쌀 → 콩",orig:"② 쌀을 먹지 않는 사람은 콩을 먹는다.",v:"알 수 없음"},{t:"~감자 → 고구마",orig:"③ 감자를 먹지 않는 사람은 고구마를 먹는다.",v:"알 수 없음"},{t:"~콩 → 수수",orig:"④ 콩을 먹지 않는 사람은 수수를 먹는다.",v:"거짓"},{t:"고구마 → ~수수",orig:"⑤ 고구마를 먹는 사람은 수수를 먹지 않는다.",v:"★ 항상 참!"}],answerIdx:4},{id:6,title:"예제6 · 음료 논리",color:"teal",premisesText:["커피를 마시는 사람은 차를 마시지 않는다.","주스를 마시는 사람은 우유를 마시지 않는다.","차를 마시지 않는 사람은 주스를 마신다.","우유를 마시는 사람은 커피를 마시지 않는다."],premises:["커피 → ~차","주스 → ~우유","~차 → 주스","우유 → ~커피"],chain:"커피 → ~차 → 주스 → ~우유",chainDual:"우유 → ~주스 → 차 → ~커피",options:[{t:"~커피 → 주스",orig:"① 커피를 마시지 않는 사람은 주스를 마신다.",v:"알 수 없음"},{t:"주스 → ~차",orig:"② 주스를 마시는 사람은 차를 마시지 않는다.",v:"알 수 없음"},{t:"우유 → ~주스",orig:"③ 우유를 마시는 사람은 주스를 마시지 않는다.",v:"★ 항상 참!"},{t:"~차 → 커피",orig:"④ 차를 마시지 않는 사람은 커피를 마신다.",v:"알 수 없음"},{t:"~주스 → 커피",orig:"⑤ 주스를 마시지 않는 사람은 커피를 마신다.",v:"거짓"}],answerIdx:2},{id:7,title:"예제7 · 과일 논리",color:"rose",premisesText:["사과를 좋아하는 사람은 바나나를 좋아하지 않는다.","오렌지를 좋아하는 사람은 포도를 좋아하지 않는다.","바나나를 좋아하지 않는 사람은 오렌지를 좋아한다.","포도를 좋아하는 사람은 사과를 좋아하지 않는다."],premises:["사과 → ~바나나","오렌지 → ~포도","~바나나 → 오렌지","포도 → ~사과"],chain:"사과 → ~바나나 → 오렌지 → ~포도",chainDual:"포도 → ~오렌지 → 바나나 → ~사과",options:[{t:"~사과 → 오렌지",orig:"① 사과를 좋아하지 않는 사람은 오렌지를 좋아한다.",v:"알 수 없음"},{t:"오렌지 → ~바나나",orig:"② 오렌지를 좋아하는 사람은 바나나를 좋아하지 않는다.",v:"알 수 없음"},{t:"포도 → ~오렌지",orig:"③ 포도를 좋아하는 사람은 오렌지를 좋아하지 않는다.",v:"★ 항상 참!"},{t:"~바나나 → 사과",orig:"④ 바나나를 좋아하지 않는 사람은 사과를 좋아한다.",v:"알 수 없음"},{t:"~오렌지 → 사과",orig:"⑤ 오렌지를 좋아하지 않는 사람은 사과를 좋아한다.",v:"거짓"}],answerIdx:2}];const predCases=[{id:1,title:"예제1 · 수영 선수와 걷기 운동",color:"indigo",venn:{outer:"심폐",inner:"수영",third:"걷기",color:"#4f46e5",thirdColor:"#0d9488"},premises:["[전제1] 수영 선수는 심폐능력이 뛰어나다.","[전제2] 걷기 운동을 하는 어떤 선수는 수영 선수이다."],question:"[결론] 항상 참인 결론은?",options:["① 걷기 운동을 하는 어떤 선수는 심폐능력이 뛰어나다.","② 모든 수영 선수는 걷기 운동을 한다.","③ 심폐능력이 뛰어나지 않는 어떤 선수는 수영 선수이다.","④ 걷기 운동을 하지 않는 선수는 수영 선수이다.","⑤ 걷기 운동을 하는 모든 선수는 수영 선수이다."],answerIdx:0,steps:["① 전제1 기호화: \"수영 선수는 심폐능력이 뛰어나다\"는 \"모든\"이 생략된 전칭 문장이에요 → 수영 ⊂ 심폐 (수영 원 전체가 심폐 원 안에 쏙 들어가요)","② 전제2 기호화: \"걷기 운동을 하는 어떤 선수는 수영 선수이다\" → 걷기 ∩ 수영 ≠ ∅ (걷기 원과 수영 원이 일부분 겹쳐요)","③ 벤다이어그램을 그려보면: 큰 심폐 원 안에 수영 원이 완전히 들어있고, 걷기 원은 그 수영 원과 일부만 겹쳐요.","④ 핵심 관찰: 걷기와 수영이 겹치는 부분(걷기∩수영)은 수영 원 안에 있는데, 수영 원 전체가 심폐 원 안에 있으니 → 그 겹치는 부분도 무조건 심폐 원 안에 들어가요!","⑤ 그러므로 걷기 원과 심폐 원도 최소한 그 부분만큼은 반드시 겹쳐요 → \"걷기 운동을 하는 어떤 선수는 심폐능력이 뛰어나다\" = 항상 참!","⑥ 나머지 보기 확인: ②⑤는 \"모든\"이라 붙은 전칭 명제인데 전제에 그런 정보가 없어 알 수 없음 / ③은 수영⊂심폐와 정반대라 거짓 / ④는 전제와 전혀 무관해서 알 수 없음."]},{id:2,title:"예제2 · 새와 날개 있는 동물",color:"teal",venn:{outer:"날개",inner:"새",third:"난다",color:"#0d9488",thirdColor:"#4f46e5"},premises:["[전제1] 모든 새는 날개가 있는 동물이다.","[전제2] 어떤 새는 하늘을 난다."],question:"[결론] 항상 참인 결론은?",options:["① 모든 새는 하늘을 난다.","② 모든 날개가 있는 동물은 하늘을 난다.","③ 날개가 있는 동물은 새이다.","④ 하늘을 나는 모든 동물은 새이다.","⑤ 날개가 있는 어떤 동물은 하늘을 난다."],answerIdx:4,steps:["① 전제1 기호화: \"모든 새는 날개가 있는 동물이다\" → 새 ⊂ 날개동물 (새 원 전체가 날개동물 원 안에 쏙 들어가요)","② 전제2 기호화: \"어떤 새는 하늘을 난다\" → 새 ∩ 난다 ≠ ∅ (새 원과 난다 원이 일부분 겹쳐요)","③ 벤다이어그램: 큰 날개동물 원 안에 새 원이 완전히 들어있고, 난다 원은 그 새 원과 일부만 겹쳐요.","④ 핵심 관찰: 새와 난다가 겹치는 부분(새∩난다)은 새 원 안에 있는데, 새 원 전체가 날개동물 원 안에 있으니 → 그 겹치는 부분도 무조건 날개동물 원 안에 들어가요!","⑤ 그러므로 날개동물 원과 난다 원도 최소한 그 부분만큼은 반드시 겹쳐요 → \"날개가 있는 어떤 동물은 하늘을 난다\" = 항상 참!","⑥ 나머지 보기 확인: ①은 \"모든 새가 난다\"인데 전제2는 \"어떤\"이라 알 수 없음(펭귄처럼 못 나는 새도 있을 수 있음) / ②는 날개동물 전체가 난다는 보장 없음(곤충 등) / ③④는 새⊂날개동물의 방향을 거꾸로 뒤집은 오류라서 알 수 없음."]},{id:3,title:"예제3 · 빠르게 날 수 있는 새",color:"rose",venn:{outer:"높이",inner:"날개",third:"빠른",color:"#e11d48",thirdColor:"#d97706",swap:true},premises:["[전제1] 날개가 넓은 어떤 새는 빠르게 날 수 있는 새이다.","[전제2] ?"],question:"[결론] 빠르게 날 수 있는 어떤 새는 높이 날 수 있는 새이다. → 이 결론을 항상 참으로 만드는 전제2는?",options:["① 높이 날 수 없는 어떤 새는 날개가 넓은 새이다.","② 날개가 넓은 모든 새는 높이 날 수 있는 새이다.","③ 높이 날 수 없는 새는 빠르게 날 수 있는 새이다.","④ 높이 날 수 있는 어떤 새는 빠르게 날 수 없는 새이다.","⑤ 날개가 넓지 않은 모든 새는 높이 날 수 있는 새이다."],answerIdx:1,steps:["① 전제1 기호화: \"날개가 넓은 어떤 새는 빠르게 날 수 있는 새이다\" → 날개넓음 ∩ 빠름 ≠ ∅ (두 원이 일부분 겹쳐요)","② 목표(결론) 기호화: \"빠르게 날 수 있는 어떤 새는 높이 날 수 있는 새이다\" → 빠름 ∩ 높이 ≠ ∅ 를 반드시 참으로 만들어야 해요.","③ 전략: 전제1에서 이미 확보한 \"날개넓음∩빠름\" 겹치는 부분을, 통째로 \"높이\" 원 안으로 밀어넣어 줄 연결고리가 필요해요.","④ 보기 ②를 넣어보면: \"날개가 넓은 모든 새는 높이 날 수 있다\" → 날개넓음 ⊂ 높이 (날개넓음 원 전체가 높이 원 안에 들어감)","⑤ 확인: 날개넓음∩빠름 부분은 날개넓음 원 안에 있으니, 날개넓음⊂높이에 의해 이 부분도 자동으로 높이 원 안에 들어가요 → 그럼 이 부분은 빠름 원과도 겹치고 높이 원과도 겹치니까 → 빠름∩높이 ≠ ∅ 완성! 결론이 항상 참이 돼요.","⑥ 나머지 보기 확인: ①③⑤는 \"높이 못 나는 새\"에 대한 이야기라 날개넓음∩빠름 부분을 높이 원으로 연결해주지 못해요 / ④는 오히려 결론과 반대 방향이라 결론을 보장하지 못해요. → 정답은 오직 ②뿐!"]}];const limits=[{emoji:"🔢",color:"rose",title:"한정자(모든/어떤)를 표현 못 해요",desc:"사람의 문장에는 \"모든\", \"어떤/약간\" 같이 수량·범위를 정하는 한정자(quantifier)가 있어요. 그런데 명제 논리는 문장 전체를 하나의 기호(p)로 뭉뚱그려서, 이 정확한 수학적 범위를 표현할 수 없어요."},{emoji:"🚫",color:"violet",title:"부정 문장의 의미를 잃어버려요",desc:"\"모든 자동차는 기계이다\"를 부정하면? → \"모든 자동차가 기계가 아니다\"인지, \"일부 자동차는 기계가 아니다\"인지 명제 논리는 구분하지 못해요. AI는 ~p를 보고 단지 참↔거짓만 뒤집을 뿐, \"모든\"과 \"일부\"의 포함 관계를 스스로 이해하지 못해요."},{emoji:"🧱",color:"sky",title:"문장 구조(주어·술어)를 무시해요",desc:"명제 논리는 문장을 쪼갤 수 없는 하나의 \"원자\"처럼 취급해요. \"자동차가 충돌했다\"(주어)와 \"충돌한 것은 자동차이다\"(술어)에서 자동차의 역할이 달라지는데, 명제 논리는 이 변화를 전혀 담을 수 없어요."}];const knowTopics=[{key:"rule",emoji:"📏",color:"indigo",name:"규칙 (Rule)",summary:"조건(IF)과 행동(THEN)으로 지식을 표현하는 방법",blocks:[{h:"어떻게 표현하나요?",p:"규칙은 IF(조건)과 THEN(행동)으로 나뉘어요. 컴퓨터는 IF 조건이 참인지 검사하고, 참이면 THEN 행동을 실행해요. 사람이 판단하는 방식을 그대로 컴퓨터로 옮긴 거예요."},{h:"신호등 규칙 예시",p:"IF 빨간불 THEN 멈춰서 기다린다 / IF 노란불 THEN 멈출 준비 / IF 초록불 THEN 건넌다"},{h:"어디에 쓰일까?",p:"스팸 필터(광고 단어 반복→스팸함), 챗봇(영업시간 질문→정해진 답), 게임(체력 20% 이하→회복 아이템 사용)"},{h:"장점",p:"① 이해하기 쉬움(만약 ~라면 구조) ② 빠르고 정확함 ③ 수정이 쉬움"},{h:"한계",p:"① 규칙 폭발(지식↑ → 수만 개 규칙 관리 불가) ② 모호한 상황(\"약간 쌀쌀\") 판단 불가 ③ 스스로 학습 못 함(사람이 다 적어줘야 함)"}]},{key:"sem",emoji:"🕸️",color:"teal",name:"의미망 (Semantic Network)",summary:"개념(단어) 사이의 관계를 노드와 간선의 그래프로 표현",blocks:[{h:"구성 요소",p:"노드 = 개념/단어 (예: 동물, 조류, 참새) / 간선 = 개념 사이의 관계 (예: ~이다, ~할 수 있다)"},{h:"핵심 특징",p:"개념 중심으로 지식을 표현해요. 사람이 세상을 이해하듯, 관련 개념을 서로 연결해요. 예) 참새 →(이다)→ 조류 →(할수있다)→ 날아다닌다"},{h:"왜 의미망?",p:"단어 목록만으로는 진짜 뜻을 표현 못 해요. \"참새\"가 조류이고, 날개가 있고, 날 수 있다는 연관 정보를 동시에 담는 스마트한 방식이에요."},{h:"결정적 한계 · 예외 처리",p:"상위: \"조류는 날 수 있다\" + 하위: \"타조는 조류\" → 자동추론: \"타조는 날 수 있다\"(오류! 타조는 못 남). 해결책: 하위에 \"타조-할수있다->뛰어다닌다\"를 추가하고, 구체적 하위 지식을 상위 규칙보다 우선 적용!"}]},{key:"kg",emoji:"🌐",color:"sky",name:"지식그래프 (Knowledge Graph)",summary:"현실의 실제 데이터(객체)를 그래프로 저장한 것",blocks:[{h:"의미망과 무엇이 다를까?",p:"의미망은 \"개념\"끼리 연결하지만, 지식그래프는 \"실제 데이터(객체)\"끼리 연결해요. 사람·지역·날짜·문서 같은 실제 데이터를 중심으로 훨씬 많은 정보를 저장해요."},{h:"데이터 중심인 이유",p:"개념 중심(의미망): 동물·식물·과일처럼 사전적 개념. 데이터 중심(지식그래프): 서울·아이폰15·방탄소년단·세종대왕처럼 현실의 실제 개체 자체를 엮어요."},{h:"예시",p:"\"세종대왕\", \"조선 시대\", \"1397년 5월 15일\" 같은 대규모 실제 데이터를 노드로 연결해요."},{h:"어디에 쓰일까?",p:"포털 검색 엔진(관련 인물·장소 표시), AI 챗봇(자연스러운 답변 생성), 추천 시스템(구매·시청 기록 연결 추천). 현대 AI 검색·추천의 핵심 뼈대!"}]},{key:"frame",emoji:"🗃️",color:"violet",name:"프레임 (Frame)",summary:"지식을 관계있는 것끼리 분류하고 상하 관계로 구성한 것",blocks:[{h:"구성",p:"하나의 프레임 = 슬롯(Slot) + 슬롯 값(Value)의 집합. 슬롯 = 속성의 이름 / 슬롯 값 = 실제 저장된 내용"},{h:"예시 · 음악 정보",p:"제목: 졸려? / 작사: 진누리 / 작곡: 에이아이 / 가수: 베아트리스 (표처럼 정리돼요)"},{h:"특징",p:"① 관계있는 지식끼리 분류 ② 상하 관계로 구성(상위 프레임 성질을 하위가 물려받음: 음악→가요) ③ 슬롯 구조라 표(table)와 비슷해 사람·컴퓨터 모두 이해하기 쉬움"}]}];const repMethods=[{num:"01",emoji:"🔤",color:"indigo",name:"명제 논리",tab:"prop",desc:"참·거짓을 판별할 수 있는 문장으로 지식을 표현하고 논리적으로 추론해요"},{num:"02",emoji:"🔮",color:"violet",name:"술어 논리",tab:"pred",desc:"주어와 술어로 분해해 \"모든\"·\"어떤\" 같은 범위까지 정확히 표현해요"},{num:"03",emoji:"📏",color:"amber",name:"규칙",tab:"know",sub:"rule",desc:"만약(IF) ~라면 ~이다(THEN) 형태의 조건부 논리로 행동을 결정해요"},{num:"04",emoji:"🕸️",color:"teal",name:"의미망",tab:"know",sub:"sem",desc:"개념(노드)과 관계(간선)를 거미줄처럼 연결한 네트워크예요"},{num:"05",emoji:"🌐",color:"sky",name:"지식그래프",tab:"know",sub:"kg",desc:"의미망을 실제 데이터(사람·장소·날짜) 중심으로 크게 확장한 형태예요"},{num:"06",emoji:"🗃️",color:"rose",name:"프레임",tab:"know",sub:"frame",desc:"속성(슬롯)과 값(슬롯값)으로 지식을 표처럼 정리해요"}];const dikwStages=[{key:"data",stage:"자료",eng:"Data",emoji:"🔍",color:"sky",title:"단서의 발견",desc:"관찰이나 실험, 조사로 얻은 있는 그대로의 값이에요. 아직 가공되지 않은 순수한 상태예요.",example:"현장에서 주운 발자국 크기: 270mm",detail:"\"270\"이라는 숫자 하나만 있으면 그게 신발 크기인지, 몸무게인지, 다른 뭔지 아직 알 수 없어요. 그냥 값 그 자체일 뿐이에요."},{key:"info",stage:"정보",eng:"Information",emoji:"🔗",color:"amber",title:"단서의 연결",desc:"자료를 사용자의 필요에 따라 정리하고, 의미와 가치를 부여한 결과예요.",example:"\"범인은 270mm 신발을 신은 사람이다\"",detail:"숫자 270에 \"신발 크기\"라는 의미를 붙이고, \"범인의 특징을 찾는다\"는 목적에 맞게 정리했어요. 이제 쓸모 있는 정보가 되었어요."},{key:"know",stage:"지식",eng:"Knowledge",emoji:"💡",color:"violet",title:"진실의 완성",desc:"정보를 일반화하고 체계화해서, 다른 상황에도 적용할 수 있는 원리로 만든 거예요.",example:"\"신발 크기가 크면 보통 키도 큰 편이다\" 같은 일반적인 규칙",detail:"이 지식을 이용하면 \"범인은 키가 큰 사람일 가능성이 높다\"처럼 새로운 것을 추론할 수 있어요. 이게 바로 인공지능
