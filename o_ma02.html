  <style>
    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: linear-gradient(135deg, #0f766e 0%, #047857 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    @keyframes bounceOnce {
      0%, 100% { transform: translateY(0) translateX(-50%); }
      50% { transform: translateY(-10px) translateX(-50%); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .slide-in { animation: slideIn 0.4s ease-out; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-5px); }
      40%,80% { transform: translateX(5px); }
    }
    .shake { animation: shake 0.4s ease; }
    @keyframes popIn {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: popIn 0.35s ease-out; }
    .smooth-move { transition: transform 0.7s ease, left 0.8s ease, top 0.8s ease; }
    input[type=range] { accent-color: #0d9488; }
    button:focus-visible, a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      .slide-in, .shake, .pop-in { animation: none; }
      .smooth-move { transition: none; }
    }
